    R("t", "TỔNG CỘNG NGUỒN VỐN (500 = 300+400)", "500", x => no310(x) + x.thue + x.vonGop + x.loiNhuan);
    canDoi = Math.abs(ts(c) - (no310(c) + c.thue + c.vonGop + c.loiNhuan)) < 2;
  } else {
    const pt = x => x.phaiThuKH + x.traTruocNB + x.phaiThuKhac;
    const ts = x => x.tien + pt(x) + x.htk + x.nguyenGia + x.haoMon + x.vatKhauTru + x.taiSanKhac;
    const npt = x => x.phaiTraNB + x.nguoiMuaTraTruoc + x.thue + x.phaiTraNLD + x.phaiTraKhac + x.vay;
    R("g", "TÀI SẢN", "", () => "");
    R("d", "I. Tiền và các khoản tương đương tiền", "110", x => x.tien);
    R("d", "II. Đầu tư tài chính", "120", () => 0);
    R("t", "III. Các khoản phải thu", "130", pt);
    R("d", "1. Phải thu của khách hàng", "131", x => x.phaiThuKH);
    R("d", "2. Trả trước cho người bán", "132", x => x.traTruocNB);
    R("d", "4. Phải thu khác", "134", x => x.phaiThuKhac);
    R("t", "IV. Hàng tồn kho", "140", x => x.htk);
    R("d", "1. Hàng tồn kho", "141", x => x.htk);
    R("t", "V. Tài sản cố định", "150", x => x.nguyenGia + x.haoMon);
    R("d", "- Nguyên giá", "151", x => x.nguyenGia);
    R("d", "- Giá trị hao mòn lũy kế (*)", "152", x => x.haoMon);
    R("d", "VI. Bất động sản đầu tư", "160", () => 0);
    R("d", "VII. XDCB dở dang", "170", () => 0);
    R("t", "VIII. Tài sản khác", "180", x => x.vatKhauTru + x.taiSanKhac);
    R("d", "1. Thuế GTGT được khấu trừ", "181", x => x.vatKhauTru);
    R("d", "2. Tài sản khác", "182", x => x.taiSanKhac);
    R("t", "TỔNG CỘNG TÀI SẢN (200 = 110+120+130+140+150+160+170+180)", "200", ts);
    R("g", "NGUỒN VỐN", "", () => "");
    R("t", "I. NỢ PHẢI TRẢ", "300", npt);
    R("d", "1. Phải trả người bán", "311", x => x.phaiTraNB);
    R("d", "2. Người mua trả tiền trước", "312", x => x.nguoiMuaTraTruoc);
    R("d", "3. Thuế và các khoản phải nộp Nhà nước", "313", x => x.thue);
    R("d", "4. Phải trả người lao động", "314", x => x.phaiTraNLD);
    R("d", "5. Phải trả khác", "315", x => x.phaiTraKhac);
    R("d", "6. Vay và nợ thuê tài chính", "316", x => x.vay);
    R("t", "II. VỐN CHỦ SỞ HỮU", "400", x => x.vonGop + x.loiNhuan);
    R("d", "1. Vốn góp của chủ sở hữu", "411", x => x.vonGop);
    R("d", "7. Lợi nhuận sau thuế chưa phân phối", "417", x => x.loiNhuan);
    R("t", "TỔNG CỘNG NGUỒN VỐN (500 = 300+400)", "500", x => npt(x) + x.vonGop + x.loiNhuan);
    canDoi = Math.abs(ts(c) - (npt(c) + c.vonGop + c.loiNhuan)) < 2;
  }
  const cols = [{ l: "CHỈ TIÊU", c: "1", t: "x" }, { l: "Mã số", c: "2", t: "x" }, { l: "Thuyết minh", c: "3", t: "x" },
    { l: "Số cuối kỳ", c: "4", t: "m" }, { l: "Số đầu năm", c: "5", t: "m" }];
  const code = cfg.LOAI_HINH === "DNSN" ? "B01-DNSN" : "B01a-DNN";
  const m = kt_model(cfg, ky, opt.id, code, "BÁO CÁO TÌNH HÌNH TÀI CHÍNH", cols, rows);
  m.subtitle = "Tại ngày " + kt_fmtDate(ky.den);
  m.canDoi = canDoi;
  m.chiTieu = c;
  if (!canDoi) m.notes.push("CẢNH BÁO: Tổng tài sản khác tổng nguồn vốn — kiểm tra số dư đầu kỳ.");
  if (c.tien < 0) m.notes.push("CẢNH BÁO: Tiền âm — thiếu số dư đầu kỳ hoặc vốn góp. Xem KT_Canh_Bao.");
  return m;
}

function kt_chiTieuB02(J, tu, den) {
  const ps = kt_phatSinh(J, tu, den);
  const net = (re, no) => Object.keys(ps).filter(k => re.test(k)).reduce((s, k) => s + (no ? ps[k].no - ps[k].co : ps[k].co - ps[k].no), 0);
  const psCo511 = Object.keys(ps).filter(k => /^511/.test(k)).reduce((s, k) => s + ps[k].co, 0);
  const psNo511 = Object.keys(ps).filter(k => /^511/.test(k)).reduce((s, k) => s + ps[k].no, 0);
  const x = {};
  x["01"] = psCo511; x["02"] = psNo511; x["10"] = x["01"] - x["02"];
  x["11"] = net(/^632$/, true); x["20"] = x["10"] - x["11"];
  x["21"] = net(/^515$/, false); x["22"] = net(/^635$/, true); x["23"] = 0;
  x["24"] = net(/^642/, true); x["30"] = x["20"] + x["21"] - x["22"] - x["24"];
  x["31"] = net(/^711$/, false); x["32"] = net(/^811$/, true); x["40"] = x["31"] - x["32"];
  x["50"] = x["30"] + x["40"]; x["51"] = net(/^821$/, true); x["60"] = x["50"] - x["51"];
  return x;
}

function kt_mdlB02(J, ky, opt) {
  const cfg = J.cfg;
  const a = kt_chiTieuB02(J, ky.tu, ky.den);
  const tuT = new Date(ky.tu); tuT.setFullYear(tuT.getFullYear() - 1);
  const denT = new Date(ky.den); denT.setFullYear(denT.getFullYear() - 1);
  const b = kt_chiTieuB02(J, tuT, denT);
  const L = [["1. Doanh thu bán hàng và cung cấp dịch vụ", "01"], ["2. Các khoản giảm trừ doanh thu", "02"],
    ["3. Doanh thu thuần về bán hàng và cung cấp dịch vụ (10 = 01 - 02)", "10", 1], ["4. Giá vốn hàng bán", "11"],
    ["5. Lợi nhuận gộp về bán hàng và cung cấp dịch vụ (20 = 10 - 11)", "20", 1], ["6. Doanh thu hoạt động tài chính", "21"],
    ["7. Chi phí tài chính", "22"], ["- Trong đó: Chi phí lãi vay", "23"], ["8. Chi phí quản lý kinh doanh", "24"],
    ["9. Lợi nhuận thuần từ hoạt động kinh doanh (30 = 20 + 21 - 22 - 24)", "30", 1], ["10. Thu nhập khác", "31"], ["11. Chi phí khác", "32"],
    ["12. Lợi nhuận khác (40 = 31 - 32)", "40", 1], ["13. Tổng lợi nhuận kế toán trước thuế (50 = 30 + 40)", "50", 1],
    ["14. Chi phí thuế thu nhập doanh nghiệp", "51"], ["15. Lợi nhuận sau thuế thu nhập doanh nghiệp (60 = 50 - 51)", "60", 1]];
  const dnsn = cfg.LOAI_HINH === "DNSN";
  const rows = L.map(l => ({ k: l[2] ? "t" : "d", c: [l[0], dnsn ? "" : l[1], "", kt_round(a[l[1]]), kt_round(b[l[1]])] }));
  const cols = [{ l: "CHỈ TIÊU", c: "1", t: "x" }, { l: "Mã số", c: "2", t: "x" }, { l: "Thuyết minh", c: "3", t: "x" },
    { l: ky.ten, c: "4", t: "m" }, { l: "Cùng kỳ năm trước", c: "5", t: "m" }];
  const m = kt_model(cfg, ky, opt.id, dnsn ? "B02-DNSN" : "B02-DNN", "BÁO CÁO KẾT QUẢ HOẠT ĐỘNG KINH DOANH", cols, rows);
  m.chiTieu = a;
  if (dnsn) m.notes.push("Mẫu B02-DNSN: chỉ tiêu trình bày theo thứ tự chuẩn; đối chiếu mã số với phụ lục Thông tư 58/2026/TT-BTC trước khi nộp.");
  if (!a["51"] && a["50"] > 0) m.notes.push("Chưa ghi nhận chi phí thuế TNDN (mã 51). Cuối năm lập Phiếu kế toán: Nợ 821 / Có 3334 theo số thuế ở sheet KT_Thue.");
  return m;
}

function kt_mdlB03(J, ky, opt) {
  const cfg = J.cfg;
  const tien = tk => tk === "1111" || tk === "1121";
  const x = {};
  ["01", "02", "03", "04", "05", "06", "07", "21", "22", "23", "24", "25", "31", "32", "33", "34", "35", "36"].forEach(k => x[k] = 0);
  J.pairs.forEach(p => {
    if (!kt_inKy(p, ky)) return;
    if (tien(p.no) && tien(p.co)) return; // chuyển nội bộ tiền mặt <-> ngân hàng
    if (tien(p.no)) {
      const du = p.co;
      const k = /^(511|33311|131)/.test(du) ? "01" : du === "515" ? "25" : du === "4111" ? "31" : du === "341" ? "33" : "06";
      x[k] += p.tien;
    } else if (tien(p.co)) {
      const du = p.no;
      const k = /^(331|1561|152|153|1331)$/.test(du) ? "02" : du === "334" ? "03" : du === "635" ? "04" : du === "3334" ? "05"
        : du === "211" ? "21" : du === "4111" ? "32" : du === "341" ? "34" : du === "421" ? "36" : "07";
      x[k] -= p.tien;
    }
  });
  x["20"] = x["01"] + x["02"] + x["03"] + x["04"] + x["05"] + x["06"] + x["07"];
  x["30"] = x["21"] + x["22"] + x["23"] + x["24"] + x["25"];
  x["40"] = x["31"] + x["32"] + x["33"] + x["34"] + x["35"] + x["36"];
  x["50"] = x["20"] + x["30"] + x["40"];
  const dau = kt_soDu(J, new Date(ky.tu.getTime() - 1)).tk;
  x["60"] = (dau["1111"] || 0) + (dau["1121"] || 0); x["61"] = 0; x["70"] = x["50"] + x["60"] + x["61"];
  const cuoi = kt_soDu(J, ky.den).tk;
  const L = [["I. Lưu chuyển tiền từ hoạt động kinh doanh", "", "g"],
    ["1. Tiền thu từ bán hàng, cung cấp dịch vụ và doanh thu khác", "01"], ["2. Tiền chi trả cho người cung cấp hàng hóa và dịch vụ", "02"],
    ["3. Tiền chi trả cho người lao động", "03"], ["4. Tiền lãi vay đã trả", "04"], ["5. Thuế thu nhập doanh nghiệp đã nộp", "05"],
    ["6. Tiền thu khác từ hoạt động kinh doanh", "06"], ["7. Tiền chi khác cho hoạt động kinh doanh", "07"],
    ["Lưu chuyển tiền thuần từ hoạt động kinh doanh", "20", "t"],
    ["II. Lưu chuyển tiền từ hoạt động đầu tư", "", "g"],
    ["1. Tiền chi để mua sắm, xây dựng TSCĐ, BĐSĐT và các tài sản dài hạn khác", "21"], ["2. Tiền thu từ thanh lý, nhượng bán TSCĐ, BĐSĐT và các tài sản dài hạn khác", "22"],
    ["3. Tiền chi cho vay, đầu tư góp vốn vào đơn vị khác", "23"], ["4. Tiền thu hồi cho vay, đầu tư góp vốn vào đơn vị khác", "24"],
    ["5. Tiền thu lãi cho vay, cổ tức và lợi nhuận được chia", "25"], ["Lưu chuyển tiền thuần từ hoạt động đầu tư", "30", "t"],
    ["III. Lưu chuyển tiền từ hoạt động tài chính", "", "g"],
    ["1. Tiền thu từ phát hành cổ phiếu, nhận vốn góp của chủ sở hữu", "31"], ["2. Tiền trả lại vốn góp cho các chủ sở hữu, mua lại cổ phiếu", "32"],
    ["3. Tiền thu từ đi vay", "33"], ["4. Tiền trả nợ gốc vay và nợ thuê tài chính", "34"], ["5. Tiền trả nợ gốc thuê tài chính", "35"],
    ["6. Cổ tức, lợi nhuận đã trả cho chủ sở hữu", "36"], ["Lưu chuyển tiền thuần từ hoạt động tài chính", "40", "t"],
    ["Lưu chuyển tiền thuần trong kỳ (50 = 20 + 30 + 40)", "50", "t"], ["Tiền và tương đương tiền đầu kỳ", "60"],
    ["Ảnh hưởng của thay đổi tỷ giá hối đoái quy đổi ngoại tệ", "61"], ["Tiền và tương đương tiền cuối kỳ (70 = 50 + 60 + 61)", "70", "t"]];
  const rows = L.map(l => ({ k: l[2] || "d", c: [l[0], l[1], "", l[1] ? kt_round(x[l[1]]) : ""] }));
  const cols = [{ l: "Chỉ tiêu", c: "A", t: "x" }, { l: "Mã số", c: "B", t: "x" }, { l: "Thuyết minh", c: "C", t: "x" }, { l: ky.ten, c: "1", t: "m" }];
  const m = kt_model(cfg, ky, opt.id, "B03-DNN", "BÁO CÁO LƯU CHUYỂN TIỀN TỆ (Theo phương pháp trực tiếp)", cols, rows);
  m.khop = Math.abs(x["70"] - ((cuoi["1111"] || 0) + (cuoi["1121"] || 0))) < 2;
  return m;
}

// ---------- THUẾ: tổng hợp nghĩa vụ ước tính ----------
function kt_mdlThue(J, ky, opt) {
  const cfg = J.cfg;
  const rows = [];
  const R = (a, b, k) => rows.push({ k: k || "d", c: [a, b] });
  const dauNam = new Date(ky.nam, 0, 1);
  const dtKy = kt_doanhThu(J, ky.tu, ky.den);
  const dtNam = kt_doanhThu(J, dauNam, ky.den);
  R("Doanh thu trong kỳ (" + ky.ten + ")", dtKy);
  R("Doanh thu lũy kế từ đầu năm " + ky.nam, dtNam);
  const ketQua = { dtKy: dtKy, dtNam: dtNam, gtgt: 0, tncn: 0, tndn: 0 };
  if (cfg.LOAI_HINH === "HKD") {
    const n = kt_nhomHKD(J, ky);
    const N = KT_NGANH[cfg.NGANH_MAC_DINH];
    R("Ngưỡng doanh thu không phải nộp thuế", n.nguong);
    R("Nhóm hộ kinh doanh (theo doanh thu năm lũy kế)", "Nhóm " + n.nhom + (n.nhom === 1 ? " — không chịu thuế GTGT, không nộp TNCN" : ""), "t");
    R("Sổ kế toán phải mở (TT 152/2025)", n.so.map(s => s + "-HKD").join(", "));
    R("Doanh thu còn lại trước khi vượt ngưỡng", n.dtNam <= n.nguong ? kt_fmtMoney(n.nguong - n.dtNam) + "đ" : "Đã vượt ngưỡng");
    if (n.nhom > 1) {
      const s = kt_mdlSoDoanhThu(J, ky, { id: "x", code: "", gtgt: true, tncn: n.ppTNCN === "TY_LE" });
      ketQua.gtgt = s.tong.gtgt;
      R("Thuế GTGT tạm tính trong kỳ (" + N.ten + ")", s.tong.gtgt);
      if (n.ppTNCN === "TY_LE") { ketQua.tncn = s.tong.tncn; R("Thuế TNCN tạm tính trong kỳ (theo % doanh thu vượt ngưỡng)", s.tong.tncn); }
      else { const c = kt_mdlDTCP(J, ky, { id: "x", code: "" }); ketQua.tncn = c.tong.thue; R("Thuế TNCN tạm tính trong kỳ (theo thu nhập tính thuế)", c.tong.thue); }
    }
    R("Hóa đơn điện tử", n.dtNam > n.nguong ? "BẮT BUỘC sử dụng hóa đơn điện tử (doanh thu năm trên ngưỡng)" : "Khuyến khích sử dụng hóa đơn điện tử", "n");
    R("Kỳ khai", n.nhom === 1 ? "Thông báo doanh thu năm trước ngày 31/01 năm sau" : (n.nhom === 4 ? "GTGT, TNCN theo tháng; quyết toán TNCN trước 31/3 năm sau" : "GTGT, TNCN theo quý; quyết toán (nếu tính theo thu nhập) trước 31/3 năm sau"), "n");
  } else {
    const khauTru = kt_isKhauTru(cfg);
    if (khauTru) {
      const ps = kt_phatSinh(J, ky.tu, ky.den);
      const ra = (ps["33311"] || { co: 0 }).co, vao = (ps["1331"] || { no: 0 }).no;
      ketQua.gtgt = ra - vao;
      R("Thuế GTGT đầu ra", ra); R("Thuế GTGT đầu vào được khấu trừ", vao);
      R("Thuế GTGT phải nộp (âm = còn được khấu trừ chuyển kỳ sau)", ra - vao, "t");
    } else {
      const N = KT_NGANH[cfg.NGANH_MAC_DINH];
      ketQua.gtgt = kt_round(dtKy * N.gtgt);
      R("Thuế GTGT theo % doanh thu (" + (N.gtgt * 100) + "%, " + N.ten + ")", ketQua.gtgt, "t");
    }
    const tndnTyLe = cfg.LOAI_HINH === "DNSN" && (cfg.DNSN_PP_THUE === 1 || cfg.DNSN_PP_THUE === 3);
    if (tndnTyLe) {
      ketQua.tndn = kt_round(dtKy * cfg.DNSN_TY_LE_TNDN);
      R("Thuế TNDN theo % doanh thu (" + (cfg.DNSN_TY_LE_TNDN * 100) + "%) — KIỂM TRA tỷ lệ theo văn bản hiện hành", ketQua.tndn, "t");
    } else {
      const b = kt_chiTieuB02(J, ky.tu, ky.den);
      const rate = kt_thueSuatTNDN(cfg, dtNam);
      ketQua.tndn = kt_round(Math.max(0, b["50"]) * rate);
      R("Lợi nhuận kế toán trước thuế", b["50"]);
      R("Thuế TNDN tạm tính = lợi nhuận × " + (rate * 100) + "% (chưa điều chỉnh chi phí không được trừ)", ketQua.tndn, "t");
      R("Bút toán gợi ý cuối năm", "Phiếu kế toán: Nợ 821 / Có 3334 số tiền " + kt_fmtMoney(ketQua.tndn) + "đ", "n");
    }
  }
  R("Lưu ý", "Số liệu ước tính từ sổ sách để chủ động dòng tiền. Kê khai chính thức trên eTax/HTKK theo mẫu tờ khai hiện hành.", "n");
  const m = kt_model(cfg, ky, opt.id, "", "TỔNG HỢP NGHĨA VỤ THUẾ (ƯỚC TÍNH)", [{ l: "Nội dung", c: "A", t: "x" }, { l: "Giá trị", c: "1", t: "m" }], rows);
  m.sign = [];
  m.ketQua = ketQua;
  return m;
}

// Mẫu trống S3a-HKD / S4c-DNSN (thuế khác — người dùng tự ghi)
function kt_mdlThueKhac(J, ky, opt) {
  const cols = [{ l: "Ngày, tháng", c: "A", t: "d" }, { l: "Diễn giải", c: "B", t: "x" }, { l: "Số lượng HHDV chịu thuế", c: "1", t: "q" },
    { l: "Thuế suất tuyệt đối/đơn vị", c: "2", t: "m" }, { l: "Giá tính thuế/đơn vị", c: "3", t: "m" }, { l: "Thuế suất", c: "4", t: "x" },
    { l: "Thuế XK/NK/TTĐB theo tỷ lệ (5=1×3×4)", c: "5", t: "m" }, { l: "Theo mức tuyệt đối (6=1×2)", c: "6", t: "m" },
    { l: "Tổng thuế XK/NK/TTĐB (7=5+6)", c: "7", t: "m" }, { l: "Thuế BVMT", c: "8", t: "m" }, { l: "Thuế tài nguyên", c: "9", t: "m" }, { l: "Thuế SDĐ", c: "10", t: "m" }];
  const rows = [{ k: "n", c: ["", "Chỉ ghi khi có hoạt động chịu thuế TTĐB, BVMT, tài nguyên, SDĐ, XNK", "", "", "", "", "", "", "", "", "", ""] }];
  return kt_model(J.cfg, ky, opt.id, opt.code, "SỔ THEO DÕI NGHĨA VỤ THUẾ KHÁC", cols, rows);
}

// ---------- DANH MỤC SỔ THEO LOẠI HÌNH ----------
// Trả [{id, sheet, code, ten, batBuoc, f}] — f(J, ky) -> model
function kt_dsSo(J, ky) {
  const cfg = J.cfg;
  const L = cfg.LOAI_HINH;
  const out = [];
  const add = (id, sheet, code, ten, batBuoc, f) => out.push({ id: id, sheet: sheet, code: code, ten: ten, batBuoc: batBuoc, f: f });
  if (L === "HKD") {
    const n = kt_nhomHKD(J, ky);
    const bb = s => n.so.indexOf(s) >= 0;
    add("S1a", "HKD_S1a", "S1a-HKD", "Sổ doanh thu bán hàng hóa, dịch vụ (nhóm ≤ ngưỡng)", bb("S1a"), (J, k) => kt_mdlSoDoanhThu(J, k, { id: "S1a", code: "S1a-HKD", mau: "S1a" }));
    add("S2a", "HKD_S2a", "S2a-HKD", "Sổ doanh thu — GTGT, TNCN theo % doanh thu", bb("S2a"), (J, k) => kt_mdlSoDoanhThu(J, k, { id: "S2a", code: "S2a-HKD", gtgt: true, tncn: true }));
    add("S2b", "HKD_S2b", "S2b-HKD", "Sổ doanh thu — tính thuế GTGT", bb("S2b"), (J, k) => kt_mdlSoDoanhThu(J, k, { id: "S2b", code: "S2b-HKD", gtgt: true }));
    add("S2c", "HKD_S2c", "S2c-HKD", "Sổ chi tiết doanh thu, chi phí", bb("S2c"), (J, k) => kt_mdlDTCP(J, k, { id: "S2c", code: "S2c-HKD" }));
    add("S2d", "HKD_S2d", "S2d-HKD", "Sổ chi tiết vật liệu, dụng cụ, sản phẩm, hàng hóa", bb("S2d"), (J, k) => kt_mdlKho(J, k, { id: "S2d", code: "S2d-HKD" }));
    add("S2e", "HKD_S2e", "S2e-HKD", "Sổ chi tiết tiền", bb("S2e"), (J, k) => kt_mdlTien(J, k, { id: "S2e", code: "S2e-HKD" }));
    add("S3a", "HKD_S3a", "S3a-HKD", "Sổ theo dõi nghĩa vụ thuế khác (khi có)", false, (J, k) => kt_mdlThueKhac(J, k, { id: "S3a", code: "S3a-HKD" }));
    add("CN", "HKD_Cong_No", "", "Sổ chi tiết công nợ (quản trị)", false, (J, k) => kt_mdlCongNo(J, k, { id: "CN", code: "" }));
  } else if (L === "DNSN") {
    const pp = cfg.DNSN_PP_THUE || 2;
    const bb = list => list.indexOf(pp) >= 0;
    add("S1", "DNSN_S1", "S1-DNSN", "Sổ doanh thu (GTGT, TNDN theo %)", bb([1]), (J, k) => kt_mdlSoDoanhThu(J, k, { id: "S1", code: "S1-DNSN", gtgt: true, tndnTyLe: true }));
    add("S2a", "DNSN_S2a", "S2a-DNSN", "Sổ doanh thu (GTGT theo %)", bb([2]), (J, k) => kt_mdlSoDoanhThu(J, k, { id: "S2a", code: "S2a-DNSN", gtgt: true }));
    add("S2b", "DNSN_S2b", "S2b-DNSN", "Sổ chi tiết doanh thu, chi phí", bb([2, 4]), (J, k) => kt_mdlDTCP(J, k, { id: "S2b", code: "S2b-DNSN" }));
    add("S2c", "DNSN_S2c", "S2c-DNSN", "Sổ chi tiết vật liệu, dụng cụ, sản phẩm, hàng hóa", bb([2, 4]), (J, k) => kt_mdlKho(J, k, { id: "S2c", code: "S2c-DNSN" }));
    add("S2d", "DNSN_S2d", "S2d-DNSN", "Sổ chi tiết tiền", bb([2, 4]), (J, k) => kt_mdlTien(J, k, { id: "S2d", code: "S2d-DNSN" }));
    add("S3a", "DNSN_S3a", "S3a-DNSN", "Sổ doanh thu (TNDN theo %)", bb([3]), (J, k) => kt_mdlSoDoanhThu(J, k, { id: "S3a", code: "S3a-DNSN", tndnTyLe: true }));
    add("S3b", "DNSN_S3b", "S3b-DNSN", "Sổ theo dõi nghĩa vụ thuế GTGT", bb([3, 4]), (J, k) => kt_mdlThueGTGT(J, k, { id: "S3b", code: "S3b-DNSN" }));
    add("S4a", "DNSN_S4a", "S4a-DNSN", "Sổ chi tiết thanh toán công nợ", false, (J, k) => kt_mdlCongNo(J, k, { id: "S4a", code: "S4a-DNSN" }));
    add("S4c", "DNSN_S4c", "S4c-DNSN", "Sổ theo dõi nghĩa vụ thuế khác", false, (J, k) => kt_mdlThueKhac(J, k, { id: "S4c", code: "S4c-DNSN" }));
    add("B01", "BCTC_B01", "B01-DNSN", "Báo cáo tình hình tài chính", bb([2, 4]), (J, k) => kt_mdlB01(J, k, { id: "B01" }));
    add("B02", "BCTC_B02", "B02-DNSN", "Báo cáo kết quả hoạt động kinh doanh", bb([2, 4]), (J, k) => kt_mdlB02(J, k, { id: "B02" }));
  } else {
    add("NKC", "DNN_S03a_NKC", "S03a-DNN", "Sổ Nhật ký chung", true, (J, k) => kt_mdlNKC(J, k, { id: "NKC", code: "S03a-DNN" }));
    add("SC", "DNN_S03b_So_Cai", "S03b-DNN", "Sổ Cái", true, (J, k) => kt_mdlSoCai(J, k, { id: "SC", code: "S03b-DNN" }));
    add("QUY", "DNN_S04a_Quy", "S04a-DNN", "Sổ quỹ tiền mặt", true, (J, k) => kt_mdlTien(J, k, { id: "QUY", code: "S04a-DNN", tks: ["1111"], title: "SỔ QUỸ TIỀN MẶT" }));
    add("TGNH", "DNN_TGNH", "", "Sổ tiền gửi ngân hàng", true, (J, k) => kt_mdlTien(J, k, { id: "TGNH", code: "", tks: ["1121"], title: "SỔ TIỀN GỬI NGÂN HÀNG" }));

// S3b-DNSN: Sổ theo dõi nghĩa vụ thuế GTGT (khấu trừ)
function kt_mdlThueGTGT(J, ky, opt) {
  const cols = [{ l: "Số hiệu chứng từ", c: "A", t: "x" }, { l: "Ngày, tháng", c: "B", t: "d" }, { l: "Diễn giải", c: "C", t: "x" },
    { l: "Thuế GTGT đầu vào", c: "1", t: "m" }, { l: "Thuế GTGT đầu ra", c: "2", t: "m" }];
  const rows = [];
  let vao = 0, ra = 0;
  J.pairs.filter(p => kt_inKy(p, ky) && (p.no === "1331" || p.co === "33311")).sort((a, b) => a.ngay - b.ngay).forEach(p => {
    if (p.no === "1331") { vao += p.tien; rows.push({ k: "d", c: [p.soCT, kt_fmtDate(p.ngay), p.dienGiai, p.tien, ""] }); }
    else { ra += p.tien; rows.push({ k: "d", c: [p.soCT, kt_fmtDate(p.ngay), p.dienGiai, "", p.tien] }); }
  });
  rows.push({ k: "t", c: ["", "", "Cộng phát sinh", vao, ra] });
  rows.push({ k: "t", c: ["", "", "Thuế GTGT phải nộp (+) / còn được khấu trừ (−)", "", ra - vao] });
  return kt_model(J.cfg, ky, opt.id, opt.code, "SỔ THEO DÕI NGHĨA VỤ THUẾ GTGT", cols, rows);
}

// ---------- DASHBOARD ----------
function kt_dashboard(J, nam) {
  const cfg = J.cfg;
  nam = +nam || new Date().getFullYear();
  const now = new Date();
  const kyNam = kt_ky({ loai: "nam", nam: nam });
  const thang = [];
  for (let t = 1; t <= 12; t++) {
    const k = kt_ky({ loai: "thang", nam: nam, thang: t });
    const b = kt_chiTieuB02(J, k.tu, k.den);
    thang.push({ t: t, dt: kt_round(b["10"]), gv: kt_round(b["11"]), cp: kt_round(b["24"] + b["22"] + b["32"]), ln: kt_round(b["50"]) });
  }
  const b = kt_chiTieuB02(J, kyNam.tu, kyNam.den);
  const den = now.getFullYear() === nam ? now : kyNam.den;
  const sd = kt_chiTieuB01(J, den);
  const nxt = kt_mdlTongHopNXT(J, kyNam, { id: "x" });
  const cn = kt_mdlCongNo(J, kt_ky({ loai: "tuy_chon", tu: "01/01/1900", den: kt_fmtDate(den) }), { id: "x" });
  const topNo = cn.tongHop.filter(x => x.tk === "131" && x.cuoi > 0).sort((a, b) => b.cuoi - a.cuoi).slice(0, 5);
  const out = {
    loaiHinh: cfg.LOAI_HINH, tenDonVi: cfg.TEN_DON_VI, nam: nam,
    doanhThu: kt_round(b["10"]), giaVon: kt_round(b["11"]), chiPhi: kt_round(b["24"] + b["22"] + b["32"]), loiNhuan: kt_round(b["50"]),
    tienMat: kt_round(kt_soDu(J, den).tk["1111"] || 0), tienGui: kt_round(kt_soDu(J, den).tk["1121"] || 0),
    phaiThu: kt_round(sd.phaiThuKH), phaiTra: kt_round(sd.phaiTraNB), tonKho: kt_round(nxt.tong.tonCuoi),
    thang: thang, topNo: topNo, canhBao: J.warnings.length,
    soChungTu: J.vouchers.length + J.src.manual.length
  };
  if (cfg.LOAI_HINH === "HKD") {
    const n = kt_nhomHKD(J, kyNam);
    out.hkd = { nhom: n.nhom, nguong: n.nguong, dtNam: kt_round(n.dtNam), so: n.so };
  }
  const t = kt_mdlThue(J, kyNam, { id: "x" });
  out.thue = t.ketQua;
  return out;
}

/* ==================== SHA-256 cho chế độ dùng thử ==================== */
function sha256(ascii){function r(v,a){return(v>>>a)|(v<<(32-a))}var mp=Math.pow,mw=mp(2,32),i,j,res='',w=[],abl=ascii.length*8,h=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pl=k.length,ic={};for(var c=2;pl<64;c++){if(!ic[c]){for(i=0;i<313;i+=c)ic[i]=c;h[pl]=(mp(c,.5)*mw)|0;k[pl++]=(mp(c,1/3)*mw)|0}}ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return;w[i>>2]|=j<<((3-i)%4)*8}w[w.length]=((abl/mw)|0);w[w.length]=(abl);for(j=0;j<w.length;){var W=w.slice(j,j+=16),oh=h;h=h.slice(0,8);for(i=0;i<64;i++){var w15=W[i-15],w2=W[i-2],a=h[0],e=h[4],t1=h[7]+(r(e,6)^r(e,11)^r(e,25))+((e&h[5])^((~e)&h[6]))+k[i]+(W[i]=(i<16)?W[i]:(W[i-16]+(r(w15,7)^r(w15,18)^(w15>>>3))+W[i-7]+(r(w2,17)^r(w2,19)^(w2>>>10)))|0),t2=(r(a,2)^r(a,13)^r(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2]));h=[(t1+t2)|0].concat(h);h[4]=(h[4]+t1)|0}for(i=0;i<8;i++)h[i]=(h[i]+oh[i])|0}for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(h[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16)}return res}
function kt_hash(text){ return sha256(unescape(encodeURIComponent(text))); }

const PAGES = [["tongquan", "Tổng quan"], ["chungtu", "Chứng từ"], ["congno", "Công nợ"], ["sosach", "Sổ sách"], ["baocao", "Báo cáo & thuế"], ["kyso", "Ký điện tử"], ["caidat", "Cài đặt"]];
const svg = k => '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICON[k] + '</svg>';

const UI = {

function renderConnect() {
  $("#root").innerHTML = `<main class="connect">
    <h1>YOHU Kế toán</h1>
    <p class="lead">Chứng từ, công nợ, sổ sách và báo cáo tài chính tự động cho hộ kinh doanh và doanh nghiệp nhỏ — chạy trên Google Sheet của chính bạn.</p>
    <div class="sheet pad">
      <form id="f-connect" class="form" style="grid-template-columns:1fr">
        <div><label for="c-url">Đường dẫn Web App (Google Apps Script)</label>
          <input id="c-url" type="url" required placeholder="https://script.google.com/macros/s/.../exec" value="${esc(S.url)}"></div>
        <div><label for="c-token">Mã kết nối (KT_TOKEN)</label>
          <input id="c-token" required autocomplete="off" value="${esc(S.token)}">

        <div class="row"><button class="btn pri" type="submit">Kết nối dữ liệu</button><span class="sp"></span>
          <button class="btn" type="button" id="b-demo">Dùng thử với dữ liệu mẫu</button></div>
      </form>
    </div>
    <ol class="hint" style="margin-top:20px">
      <li>Dán file KeToan_V3.gs vào Apps Script của Google Sheet.</li>
      <li>Chạy “Cài đặt lần đầu”, chọn loại hình HKD / DN siêu nhỏ / DN nhỏ và vừa.</li>
      <li>Triển khai Web App, dán đường dẫn và mã kết nối vào đây.</li>
    </ol>
  </main>`;
  $("#f-connect").onsubmit = async e => {
    e.preventDefault();
    const btn = e.submitter; UI.busy(btn, true);
    S.url = $("#c-url").value.trim(); S.token = $("#c-token").value.trim(); S.demo = false;
    try { S.info = await api("ping"); store.set("url", S.url); store.set("token", S.token); renderApp(); }
    catch (err) { UI.toast(err.message, true); } finally { UI.busy(btn, false); }

function renderApp() {
  const nav = PAGES.map(([k, t]) => `<button data-p="${k}" ${S.page === k ? 'aria-current="page"' : ""}>${svg(k)}<span>${t}</span></button>`).join("");
  const mob = PAGES.filter(p => p[0] !== "caidat" && p[0] !== "kyso").map(([k, t]) => `<button data-p="${k}" ${S.page === k ? 'aria-current="page"' : ""}>${svg(k)}<span>${t.replace(" & thuế", "")}</span></button>`).join("")
    + `<button data-p="caidat" ${S.page === "caidat" ? 'aria-current="page"' : ""}>${svg("caidat")}<span>Thêm</span></button>`;
  $("#root").innerHTML = `<div class="app">
    <aside class="side"><div class="brand">YOHU Kế toán<small>${esc(LOAI_TEN[S.info.loaiHinh] || "")}</small></div>
      <nav class="nav" aria-label="Chức năng">${nav}</nav>
      <div class="side-foot">${S.demo ? "Đang xem dữ liệu mẫu" : "Đã kết nối Google Sheet"}<br><button class="btn ghost sm" id="b-out" style="padding-left:0">${S.demo ? "Thoát dùng thử" : "Ngắt kết nối"}</button><br>${esc(S.info.version)}</div>
    </aside>
    <main class="main"><div class="topbar"><h1 id="pg-title"></h1>
      <div class="who">${esc(S.info.tenDonVi || "Chưa đặt tên đơn vị")}<span class="mode ${S.demo ? "demo-flag" : ""}">${S.demo ? "Dữ liệu mẫu · " : ""}${esc(S.info.loaiHinh)}</span></div>
      <div class="period" id="period"></div></div>
      <div id="page"></div></main>
    <nav class="tabbar" aria-label="Chức năng">${mob}</nav></div>`;
  document.querySelectorAll("[data-p]").forEach(b => b.onclick = () => go(b.dataset.p));
  $("#b-out").onclick = () => { if (!S.demo) { store.del("token"); S.token = ""; } S.demo = false; renderConnect(); };
  go(S.page);
}

function periodPicker(withPeriod) {
  const el = $("#period");
  if (!withPeriod) { el.innerHTML = ""; return; }
  const y = new Date().getFullYear();
  const years = [y - 2, y - 1, y, y + 1].map(n => `<option ${S.ky.nam == n ? "selected" : ""}>${n}</option>`).join("");
  const sub = S.ky.loai === "quy" ? `<select id="k-q" aria-label="Quý">${[1, 2, 3, 4].map(q => `<option value="${q}" ${S.ky.quy == q ? "selected" : ""}>Quý ${q}</option>`).join("")}</select>`
    : S.ky.loai === "thang" ? `<select id="k-t" aria-label="Tháng">${Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}" ${S.ky.thang == i + 1 ? "selected" : ""}>Tháng ${i + 1}</option>`).join("")}</select>` : "";
  el.innerHTML = `<select id="k-l" aria-label="Loại kỳ"><option value="nam" ${S.ky.loai === "nam" ? "selected" : ""}>Cả năm</option><option value="quy" ${S.ky.loai === "quy" ? "selected" : ""}>Theo quý</option><option value="thang" ${S.ky.loai === "thang" ? "selected" : ""}>Theo tháng</option></select>${sub}<select id="k-n" aria-label="Năm">${years}</select>`;
  el.querySelectorAll("select").forEach(s => s.onchange = () => {
    S.ky.loai = $("#k-l").value; S.ky.nam = +$("#k-n").value;
    if ($("#k-q")) S.ky.quy = +$("#k-q").value; if ($("#k-t")) S.ky.thang = +$("#k-t").value;
    go(S.page);
  });
}

function go(p) {
  S.page = p;
  document.querySelectorAll("[data-p]").forEach(b => b.toggleAttribute("aria-current", b.dataset.p === p) || (b.dataset.p === p && b.setAttribute("aria-current", "page")));
  document.querySelectorAll("[data-p]").forEach(b => { if (b.dataset.p === p) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  $("#pg-title").textContent = (PAGES.find(x => x[0] === p) || [])[1] || "";
  periodPicker(["chungtu", "sosach", "baocao"].includes(p));
  $("#page").innerHTML = '<p class="loading">Đang tải dữ liệu…</p>';
  const f = { tongquan: pTongQuan, chungtu: pChungTu, congno: pCongNo, sosach: pSoSach, baocao: pBaoCao, kyso: pKySo, caidat: pCaiDat }[p];
  f().catch(e => { $("#page").innerHTML = `<div class="sheet pad"><b>Không tải được dữ liệu.</b><p class="hint">${esc(e.message)}</p><button class="btn" onclick="go('${p}')">Thử lại</button></div>`; });
}

/* ---------- Tổng quan ---------- */
async function pTongQuan() {
  const nam = S.ky.nam;
  const [d, w] = await Promise.all([api("dashboard", { nam }), api("canhBao")]);
  const L = (t, v, cls) => `<div><dt>${t}</dt><dd class="${cls || ""} ${v < 0 ? "neg" : ""}">${money(v)}</dd></div>`;
  let hkd = "";
  if (d.hkd) {
    const pct = Math.min(100, d.hkd.dtNam / (d.hkd.nguong * 1.5) * 100), mark = 100 / 1.5;
    const over = d.hkd.dtNam > d.hkd.nguong;
    hkd = `<section class="sec sheet pad"><div class="row"><h2 style="margin:0">Doanh thu năm ${nam} so với ngưỡng chịu thuế</h2><span class="sp"></span>
      ${over ? '<span class="stamp">ĐÃ VƯỢT NGƯỠNG</span>' : `<span class="pill must">Nhóm ${d.hkd.nhom} · sổ ${d.hkd.so.join(", ")}-HKD</span>`}</div>
      <div class="meter" role="img" aria-label="Đã đạt ${Math.round(d.hkd.dtNam / d.hkd.nguong * 100)}% ngưỡng"><i class="${over ? "over" : ""}" style="width:${pct}%"></i><b style="left:${mark}%"></b></div>
      <div class="row hint"><span>${money(d.hkd.dtNam)}đ đã bán</span><span class="sp"></span><span>Ngưỡng ${money(d.hkd.nguong)}đ/năm</span></div>
      <p class="hint">${over ? `Từ khi vượt ngưỡng, hộ kinh doanh phải khai, nộp thuế GTGT và TNCN theo quý, mở sổ ${d.hkd.so.join(", ")} và dùng hóa đơn điện tử. Ước tính kỳ này: GTGT ${money(d.thue.gtgt)}đ, TNCN ${money(d.thue.tncn)}đ.` : `Còn ${money(d.hkd.nguong - d.hkd.dtNam)}đ doanh thu trước khi phải nộp thuế GTGT, TNCN. Hiện chỉ cần ghi sổ S1a-HKD và thông báo doanh thu năm.`}</p></section>`;
  }
  const maxV = Math.max(1, ...d.thang.map(t => Math.max(t.dt, Math.abs(t.ln))));
  const W = 600, H = 190, bw = W / 12;
  const bars = d.thang.map((t, i) => { const h = t.dt / maxV * (H - 30); return `<rect x="${i * bw + bw * .22}" y="${H - 20 - h}" width="${bw * .56}" height="${Math.max(0, h)}" rx="2"><title>Tháng ${t.t}: doanh thu ${money(t.dt)}đ</title></rect><text x="${i * bw + bw / 2}" y="${H - 4}" text-anchor="middle">T${t.t}</text>`; }).join("");
  const pts = d.thang.map((t, i) => [i * bw + bw / 2, H - 20 - Math.max(0, t.ln) / maxV * (H - 30)]);
  const line = `<polyline class="ln" points="${pts.map(p => p.join(",")).join(" ")}"/>` + pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5"><title>Tháng ${i + 1}: lợi nhuận ${money(d.thang[i].ln)}đ</title></circle>`).join("");
  const warns = w.slice(0, 6).map(x => `<li><b>${esc(x.loai)}${x.ma ? " — " + esc(x.ma) : ""}</b><span>${esc(x.chiTiet)}</span>${x.goiY ? `<br><span>Cách xử lý: ${esc(x.goiY)}</span>` : ""}</li>`).join("");
  $("#page").innerHTML = `${hkd}
    <section class="sec"><h2>Tiền và công nợ hôm nay</h2><dl class="ledger" style="margin:0">${L("Tiền mặt", d.tienMat)}${L("Tiền gửi ngân hàng", d.tienGui)}${L("Khách còn nợ", d.phaiThu)}${L("Còn nợ nhà cung cấp", d.phaiTra)}${L("Hàng tồn kho (giá vốn)", d.tonKho)}</dl></section>
    <section class="sec"><h2>Kết quả kinh doanh năm ${nam}</h2><dl class="ledger" style="margin:0">${L("Doanh thu thuần", d.doanhThu)}${L("Giá vốn hàng bán", d.giaVon)}${L("Chi phí", d.chiPhi)}${L("Lợi nhuận trước thuế", d.loiNhuan)}</dl></section>
    <div class="two">
      <section class="sec sheet pad"><div class="row"><h2 style="margin:0">Doanh thu và lợi nhuận theo tháng</h2><span class="sp"></span>
        <div class="legend"><span><i style="background:var(--ink)"></i>Doanh thu</span><span><i style="background:var(--green);border-radius:50%"></i>Lợi nhuận</span></div></div>
        <svg class="bars" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Biểu đồ doanh thu và lợi nhuận 12 tháng">${bars}${line}</svg></section>
      <section class="sec sheet pad"><div class="row"><h2 style="margin:0">Cần kiểm tra</h2><span class="sp"></span><span class="pill ${w.length ? "warn" : ""}">${w.length} mục</span></div>
        ${w.length ? `<ul class="warns">${warns}</ul>${w.length > 6 ? `<button class="btn ghost sm" onclick="showWarns()">Xem tất cả ${w.length} mục</button>` : ""}` : '<p class="hint">Dữ liệu không có điểm bất thường.</p>'}</section>
    </div>
    ${d.topNo.length ? `<section class="sec"><h2>Khách nợ nhiều nhất</h2><div class="sheet tbl-wrap"><table class="t"><thead><tr><th>Khách hàng</th><th class="num">Còn nợ</th></tr></thead><tbody>${d.topNo.map(x => `<tr><td>${esc(x.ma)} — ${esc(x.ten)}</td><td class="num">${money(x.cuoi)}</td></tr>`).join("")}</tbody></table></div></section>` : ""}`;
  window._warns = w;
}
function showWarns() { UI.open("Dữ liệu cần kiểm tra", `<ul class="warns">${window._warns.map(x => `<li><b>${esc(x.loai)}${x.ma ? " — " + esc(x.ma) : ""}</b><span>${esc(x.chiTiet)}</span>${x.goiY ? `<br><span>Cách xử lý: ${esc(x.goiY)}</span>` : ""}</li>`).join("")}</ul>`); }

/* ---------- Chứng từ ---------- */
const LOAI_CT = { PT: "Phiếu thu", PC: "Phiếu chi", BC: "Thu qua ngân hàng", BN: "Chi qua ngân hàng", PNK: "Phiếu nhập kho", PXK: "Phiếu xuất kho", BT: "Phiếu kế toán" };
const NGUON = { DON_HANG: "Đơn hàng", NHAP_HANG: "Nhập hàng", CHI_PHI: "Chi phí", CONG_NO: "Công nợ", THU_CONG: "Lập tay" };
async function pChungTu() {
  const loai = S.ctLoai || "", q = S.ctQ || "";
  const list = await api("chungTu", { ky: S.ky, loai, q });
  const lim = S.ctLim || 100, view = list.slice(0, lim);
  const opts = `<option value="">Tất cả loại</option>` + Object.keys(LOAI_CT).map(k => `<option value="${k}" ${loai === k ? "selected" : ""}>${LOAI_CT[k]}</option>`).join("");
  const tong = list.reduce((s, v) => s + (v.tien || 0), 0);
  $("#page").innerHTML = `<div class="row sec no-print">
      <button class="btn pri" onclick="formChungTu()">Lập phiếu thu / chi</button><button class="btn" onclick="formChiPhi()">Ghi chi phí</button><span class="sp"></span>
      <select id="ct-l" aria-label="Lọc loại chứng từ">${opts}</select><input id="ct-q" type="search" placeholder="Tìm số, đối tượng, nội dung" value="${esc(q)}" aria-label="Tìm chứng từ"></div>
    <p class="hint" style="margin:-14px 0 12px">${list.length} chứng từ trong ${esc(kyLabel())}. Phiếu thu, chi, nhập, xuất kho được tạo tự động từ đơn hàng, nhập hàng, chi phí và công nợ.</p>
    ${list.length ? `<div class="sheet tbl-wrap"><table class="t ct"><thead><tr><th>Số</th><th>Ngày</th><th>Loại</th><th>Đối tượng / nội dung</th><th>Nợ / Có</th><th class="num">Số tiền</th><th>Ký</th></tr></thead><tbody>
      ${view.map(v => `<tr class="click" data-so="${esc(v.soCT)}"><td><b>${esc(v.soCT)}</b></td><td>${esc(v.ngay)}</td><td>${esc(LOAI_CT[v.loai] || v.loai)}<br><span class="hint">${esc(NGUON[v.nguon] || "")}</span></td>
        <td>${esc(v.tenDT)}<br><span class="hint">${esc(v.lyDo)}</span></td><td>${esc(v.tkNo)} / ${esc(v.tkCo)}</td><td class="num">${money(v.tien)}</td>
        <td>${/Đã ký/.test(v.ky) ? '<span class="stamp">ĐÃ KÝ</span>' : /CẢNH BÁO|XÓA/.test(v.ky) ? '<span class="pill warn">Cần xem</span>' : ""}</td></tr>`).join("")}
      <tr class="t"><td colspan="5">Cộng ${list.length} chứng từ</td><td class="num">${money(tong)}</td><td></td></tr></tbody></table></div>${list.length > lim ? `<div class="row no-print" style="margin-top:12px"><button class="btn" onclick="S.ctLim=(S.ctLim||100)+200;go('chungtu')">Hiện thêm (còn ${list.length - lim} chứng từ)</button></div>` : ""}`
      : `<div class="sheet empty">Không có chứng từ nào trong kỳ này. Đổi kỳ ở góc trên, hoặc lập phiếu mới.</div>`}`;
  $("#ct-l").onchange = e => { S.ctLoai = e.target.value; S.ctLim = 100; go("chungtu"); };
  $("#ct-q").onchange = e => { S.ctQ = e.target.value; go("chungtu"); };

function chiTietCT(soCT, v) {
  const daKy = /Đã ký/.test(v.ky);
  UI.open(LOAI_CT[v.loai] + " " + soCT, `
    <div class="row" style="align-items:flex-start"><div class="sp"><p style="margin:0"><b>${esc(v.tenDT || "—")}</b></p><p class="hint" style="margin:2px 0 10px">${esc(v.lyDo)}</p>
      <p style="margin:0">Ngày ${esc(v.ngay)} · Nợ ${esc(v.tkNo)} / Có ${esc(v.tkCo)}</p><p style="font-size:22px;font-weight:600;margin:6px 0 2px" class="num" style="text-align:left">${money(v.tien)} đ</p>
      <p class="hint" style="margin:0">${esc(kt_docSo(v.tien))}</p></div>${daKy ? '<span class="stamp big">ĐÃ KÝ</span>' : ""}</div>
    ${v.ky ? `<p class="hint">${esc(v.ky)}</p>` : ""}
    <div class="row" style="margin-top:16px"><button class="btn pri" id="d-pdf">In / xuất PDF</button>
      ${daKy ? `<button class="btn" id="d-xt">Kiểm tra toàn vẹn</button>` : `<button class="btn" id="d-ky">Ký điện tử nội bộ</button>`}
      <button class="btn" id="d-sca">Ký số VNPT SmartCA</button></div><div id="d-out" class="hint" style="margin-top:12px"></div>`);
  $("#d-pdf").onclick = async e => { UI.busy(e.target, true); try { const r = await api("pdfChungTu", { soCT }); openDoc(r); } catch (x) { UI.toast(x.message, true); } UI.busy(e.target, false); };
  if ($("#d-ky")) $("#d-ky").onclick = () => formKy(soCT);
  if ($("#d-xt")) $("#d-xt").onclick = async () => { const r = await api("xacThuc", { soCT });
    $("#d-out").innerHTML = r.nguyenVen ? `Chứng từ còn nguyên vẹn so với lúc ký.<br>Mã xác thực: <code>${esc(r.hashHienTai)}</code>` : `<b style="color:var(--stamp)">Nội dung đã thay đổi sau khi ký.</b> Mã lúc ký: <code>${esc(r.hashLucKy)}</code><br>Mã hiện tại: <code>${esc(r.hashHienTai)}</code>`; };
  $("#d-sca").onclick = () => kySmartCA({ soCT });
}

function openDoc(r) {
  if (r.url) { window.open(r.url, "_blank", "noopener"); UI.toast("Đã tạo file PDF trong Google Drive."); return; }
  const w = window.open("", "_blank");
  if (!w) { UI.toast("Trình duyệt chặn cửa sổ mới. Cho phép pop-up để xem bản in.", true); return; }
  w.document.write(r.html.replace("</body>", "<script>setTimeout(()=>print(),300)<\/script></body>")); w.document.close();
}

function formKy(soCT) {

      <button class="btn" id="b-cert">Kiểm tra chứng thư SmartCA</button><div id="cert" class="hint"></div></section>
    <section class="sec sheet pad"><h2>Cách ký một chứng từ</h2><p>Vào Chứng từ → bấm vào chứng từ → chọn Ký điện tử nội bộ hoặc Ký số VNPT SmartCA.</p><p>Báo cáo tài chính: vào Báo cáo & thuế → mở B01/B02 → Ký số SmartCA.</p></section></div>
    <section class="sec"><h2>Nhật ký ký</h2>${log.length ? `<div class="sheet tbl-wrap"><table class="t"><thead><tr><th>Thời gian</th><th>Đối tượng</th><th>Cách ký</th><th>Người ký</th><th>Trạng thái</th><th>Mã xác thực</th></tr></thead><tbody>
      ${log.map(l => `<tr><td>${esc(l.tg)}</td><td>${esc(l.doiTuong)}</td><td>${esc(l.phuongThuc)}</td><td>${esc(l.nguoiKy)}</td><td>${l.trangThai === "Đã ký" ? '<span class="stamp">ĐÃ KÝ</span>' : esc(l.trangThai)}</td><td><code style="font-size:12px">${esc(String(l.hash || "").slice(0, 16))}…</code></td></tr>`).join("")}</tbody></table></div>` : '<div class="sheet empty">Chưa ký chứng từ nào.</div>'}</section>`;
  $("#b-cert").onclick = async () => { try { const c = await api("scaChungThu"); $("#cert").innerHTML = c.length ? c.map(x => `${esc(x.subject)}<br>Serial ${esc(x.serial)} · hiệu lực ${esc(x.tu)} – ${esc(x.den)}`).join("<hr>") : "Không có chứng thư."; } catch (x) { $("#cert").textContent = x.message; } };
}

/* ---------- Cài đặt ---------- */
async function pCaiDat() {
  const c = await api("cauHinh");
  const NHOM = [["Thông tin đơn vị", ["LOAI_HINH", "TEN_DON_VI", "DIA_CHI", "MST", "DIEN_THOAI", "NGUOI_DAI_DIEN", "KE_TOAN_TRUONG", "THU_QUY", "THU_KHO", "NGUOI_LAP", "NOI_LAP", "NGAY_BAT_DAU"]],
    ["Thuế", ["NGANH_MAC_DINH", "HKD_NGUONG_DOANH_THU", "HKD_PP_TNCN", "DNSN_PP_THUE", "DNSN_TY_LE_TNDN", "DN_PP_GTGT", "THUE_SUAT_GTGT_BAN", "GIA_BAN_DA_GOM_VAT", "THUE_SUAT_GTGT_MUA", "GIA_NHAP_DA_GOM_VAT", "THUE_SUAT_TNDN"]],
    ["Thanh toán mặc định và ký số", ["TK_THU_TIEN_BAN_HANG", "TK_TRA_TIEN_MUA_HANG", "SCA_MOI_TRUONG", "SCA_USER_ID"]]];
  const by = {}; c.cfg.forEach(x => by[x.k] = x);
  const field = k => { const x = by[k]; if (!x) return ""; const id = "cf-" + k;
    const inp = x.luaChon.length ? `<select id="${id}" data-k="${k}">${x.luaChon.map(o => `<option ${String(x.v) === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>` : `<input id="${id}" data-k="${k}" value="${esc(x.v)}">`;
    const nhan = x.moTa.split(":")[0].split("(")[0].trim(); return `<div><label for="${id}">${esc(nhan)}</label>${inp}${x.moTa.trim() !== nhan ? `<p class="hint">${esc(x.moTa)}</p>` : ""}</div>`; };
  $("#page").innerHTML = `<form id="f-cf">${NHOM.map(([t, ks]) => `<section class="sec sheet pad"><h2>${t}</h2><div class="form">${ks.map(field).join("")}</div></section>`).join("")}
    <div class="row sec"><button class="btn pri" type="submit">Lưu cài đặt</button><span class="hint">Đổi loại hình sẽ đổi bộ sổ và báo cáo tương ứng.</span></div></form>
    <section class="sec sheet pad"><h2>Giao diện</h2><div class="row"><button class="btn sm" onclick="setTheme('light')">Sáng</button><button class="btn sm" onclick="setTheme('dark')">Tối</button><button class="btn sm" onclick="setTheme('')">Theo máy</button></div></section>`;
  $("#f-cf").onsubmit = async e => { e.preventDefault(); UI.busy(e.submitter, true);
    const values = {}; document.querySelectorAll("#f-cf [data-k]").forEach(i => { if (String(by[i.dataset.k].v) !== i.value) values[i.dataset.k] = i.value; });
    try { const r = await api("luuCauHinh", { values }); S.info = await api("ping"); UI.toast("Đã lưu " + r.daLuu + " mục."); renderApp(); go("caidat"); } catch (x) { UI.toast(x.message, true); } UI.busy(e.submitter, false); };
}
function setTheme(t) { if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); store.set("theme", t); }

/* ---------- Khởi động ---------- */
(function init() {
  const th = store.get("theme"); if (th) document.documentElement.setAttribute("data-theme", th);
  const q = new URLSearchParams(location.search);
  if (q.get("demo") === "1") { S.demo = true; api("ping").then(i => { S.info = i; renderApp(); }); return; }
  if (S.url && S.token) { api("ping").then(i => { S.info = i; renderApp(); }).catch(() => renderConnect()); return; }
  renderConnect();
})();
</script>
</body>
