<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOHU Kế toán</title>
<meta name="description" content="Phần mềm kế toán cho hộ kinh doanh và doanh nghiệp nhỏ: chứng từ, công nợ, sổ sách theo TT152/2025, TT58/2026, TT133/2016, báo cáo tài chính tự động, ký điện tử.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbfbf7; --sheet:#ffffff; --ink:#1b2a4a; --ink-2:#4a5878; --muted:#7a8499;
  --rule:#dfe3e8; --rule-2:#eef1f4; --green:#2f6b4f; --green-bg:#e8f2ec;
  --stamp:#c8102e; --stamp-bg:#fdecee; --amber:#9a6200; --amber-bg:#fff4dc;
  --focus:#2f6b4f; --shadow:0 1px 0 rgba(27,42,74,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#11161f; --sheet:#171d28; --ink:#e6eaf2; --ink-2:#b4bdd0; --muted:#8892a8;
  --rule:#2a3242; --rule-2:#1f2633; --green:#6fbf95; --green-bg:#1a2b23; --stamp:#ff5a6e; --stamp-bg:#2e1a1f;
  --amber:#f2b84b; --amber-bg:#2c2416; --focus:#6fbf95; } }
:root[data-theme="dark"]{ --paper:#11161f; --sheet:#171d28; --ink:#e6eaf2; --ink-2:#b4bdd0; --muted:#8892a8;
  --rule:#2a3242; --rule-2:#1f2633; --green:#6fbf95; --green-bg:#1a2b23; --stamp:#ff5a6e; --stamp-bg:#2e1a1f; --amber:#f2b84b; --amber-bg:#2c2416; --focus:#6fbf95; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;font-size:15px;line-height:1.5}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
a{color:var(--green)}
/* Khung */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{border-right:1px solid var(--rule);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;background:var(--paper)}
.brand{font-weight:700;font-size:20px;letter-spacing:-.01em;padding:0 10px 16px}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--ink-2);text-align:left}
.nav button:hover{background:var(--rule-2)}
.nav button[aria-current="page"]{background:var(--green-bg);color:var(--green);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 10px}
.main{min-width:0;padding:22px 32px 90px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-bottom:22px}
.topbar h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.015em;flex:1 1 auto}
.who{font-size:13px;color:var(--muted)}
.mode{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--green-bg);color:var(--green);margin-left:6px}
.demo-flag{background:var(--amber-bg);color:var(--amber)}
.period{display:flex;gap:6px;align-items:center}
select,input,textarea{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:7px 10px;min-height:38px}
textarea{min-height:70px;width:100%}
label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:4px}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;min-height:38px}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--green)}
.btn:disabled{opacity:.55;cursor:wait}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sp{flex:1}
/* Tờ sổ */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow)}
.pad{padding:18px 20px}
.sec{margin:0 0 26px}
.sec>h2{font-size:16px;margin:0 0 10px;font-weight:600}
.hint{font-size:13px;color:var(--muted);margin:4px 0 0}
/* Bảng cân đối tiền: dòng kẻ sổ */
.ledger{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border-top:2px solid var(--ink)}
.ledger div{padding:12px 14px 14px;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule-2)}
.ledger dt{font-size:13px;color:var(--ink-2)}
.ledger dd{margin:2px 0 0;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ledger dd.neg{color:var(--stamp)}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:22px;align-items:start}
/* Ngưỡng HKD */
.meter{position:relative;height:14px;background:var(--rule-2);border-radius:7px;margin:18px 0 8px;overflow:visible}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--green)}
.meter i.over{background:var(--stamp)}
.meter b{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
/* Bảng */
.tbl-wrap{overflow:auto;max-width:100%}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
.t th{position:sticky;top:0;background:var(--sheet);text-align:left;}
.t th.num{text-align:right}
.t th{font-weight:600;color:var(--ink-2);border-bottom:2px solid var(--ink);padding:8px 10px;vertical-align:bottom}
.t th.code{font-weight:400;font-style:italic;border-bottom:1px solid var(--rule);top:auto;color:var(--muted);padding-top:0}
.t td{border-bottom:1px solid var(--rule-2);padding:7px 10px;vertical-align:top}
.t tr.g td{background:var(--rule-2);font-weight:600}
.t tr.t td{font-weight:700;border-bottom:1px solid var(--rule)}
.t tr.n td{color:var(--muted);font-style:italic}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--green-bg)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--rule-2);color:var(--ink-2);white-space:nowrap}
.pill.must{background:var(--green-bg);color:var(--green);font-weight:600}
.pill.warn{background:var(--amber-bg);color:var(--amber)}
/* Con dấu đã ký */
.stamp{display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--stamp);color:var(--stamp);border-radius:6px;padding:0 6px;font-size:11px;font-weight:700;transform:rotate(-6deg);letter-spacing:.02em;background:var(--stamp-bg);white-space:nowrap}
.stamp.big{font-size:20px;padding:6px 16px;border-width:3px;border-radius:10px;transform:rotate(-8deg)}
/* Danh sách sổ */
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0;border-top:2px solid var(--ink)}
.books button{text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule-2);padding:12px 14px;cursor:pointer}
.books button:hover{background:var(--green-bg)}
.books .code{font-size:12px;color:var(--muted)}
.books .nm{font-weight:600;display:block;margin:2px 0 6px}
/* Biểu mẫu */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.form .full{grid-column:1/-1}
.form input,.form select{width:100%}
.words{font-size:13px;color:var(--green);margin-top:4px;min-height:1.2em}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--green);font-weight:600}
.warns li{padding:8px 0;border-bottom:1px solid var(--rule-2);font-size:14px}
.warns{list-style:none;margin:0;padding:0}
.warns b{display:block}
.warns span{color:var(--muted);font-size:13px}
/* Thông báo */
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:min(560px,92vw);box-shadow:0 6px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--stamp);color:#fff}
.loading{color:var(--muted);padding:30px 0;text-align:center}
.empty{padding:28px;text-align:center;color:var(--muted)}
dialog{border:1px solid var(--rule);border-radius:12px;padding:0;background:var(--sheet);color:var(--ink);width:min(720px,94vw)}
dialog::backdrop{background:rgba(17,22,31,.45)}
.dlg-h{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--rule)}
.dlg-h h3{margin:0;font-size:17px;flex:1}
.dlg-b{padding:18px}
/* Màn hình kết nối */
.connect{max-width:520px;margin:8vh auto;padding:0 16px}
.connect h1{font-size:30px;letter-spacing:-.02em;margin:0 0 6px}
.connect .lead{color:var(--ink-2);margin:0 0 24px}
.connect ol{padding-left:20px;color:var(--ink-2);font-size:14px}
.bars rect{fill:var(--ink)} .bars .ln{stroke:var(--green);fill:none;stroke-width:2.5} .bars circle{fill:var(--green)}
.bars text{fill:var(--muted);font-size:11px;font-family:inherit}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink-2)} .legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
/* Di động */
.tabbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:16px 16px 92px}
  .two{grid-template-columns:1fr}
  .topbar h1{font-size:21px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--rule);z-index:40;padding:4px 2px env(safe-area-inset-bottom)}
  .tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 0;color:var(--muted);cursor:pointer}
  .tabbar button[aria-current="page"]{color:var(--green);font-weight:600}
  .tabbar svg{width:20px;height:20px}
  .ledger dd{font-size:19px}
  .t{min-width:640px}
  .t.ct{min-width:0} .t.ct td:nth-child(3),.t.ct th:nth-child(3),.t.ct td:nth-child(5),.t.ct th:nth-child(5),.t.ct td:nth-child(2),.t.ct th:nth-child(2){display:none}
  .t.ct tr.t td:first-child{display:table-cell}
}
@media print{
  .side,.tabbar,.topbar .period,.no-print,.toast{display:none!important}
  .app{display:block} .main{padding:0} body{background:#fff;color:#000;font-family:"Times New Roman",serif}
  .sheet{border:0;box-shadow:none} .t th{position:static}
  .print-only{display:block!important}
}
.print-only{display:none}
@media (prefers-reduced-motion:no-preference){ .stamp.anim{animation:press .35s ease-out} @keyframes press{from{transform:rotate(-8deg) scale(1.6);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}} }
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<dialog id="dlg"><div class="dlg-h"><h3 id="dlg-t"></h3><button class="btn ghost" onclick="UI.close()" aria-label="Đóng">Đóng</button></div><div class="dlg-b" id="dlg-b"></div></dialog>

<script>
/* ==================== ĐỘNG CƠ KẾ TOÁN (dùng chung với Google Apps Script) ==================== */
/**
 * ================================================================
 *  YOHU KẾ TOÁN V3 — SỔ SÁCH, CHỨNG TỪ, BÁO CÁO TÀI CHÍNH, KÝ SỐ
 *  File MỚI — dán thành 1 file riêng trong cùng dự án Apps Script
 *  (Tiện ích mở rộng > Apps Script > dấu + > Tập lệnh > đặt tên "KeToan_V3").
 *
 *  KHÔNG sửa / xóa dữ liệu ở các sheet cũ (Don_Hang_Chi_Tiet, San_pham,
 *  Nhap_hang, Chi_phi, So_Cong_No...). Module chỉ ĐỌC các sheet cũ và
 *  GHI vào các sheet mới có tiền tố KT_, HKD_, DNSN_, DNN_, BCTC_.
 *
 *  Chế độ kế toán áp dụng (cập nhật 10/2026):
 *   - Hộ kinh doanh, cá nhân kinh doanh: Thông tư 152/2025/TT-BTC (hiệu lực 01/01/2026)
 *   - Doanh nghiệp siêu nhỏ: Thông tư 58/2026/TT-BTC (hiệu lực 01/07/2026)
 *   - Doanh nghiệp nhỏ và vừa: Thông tư 133/2016/TT-BTC
 *
 *  Tất cả hàm của module có tiền tố kt_ để không trùng tên với code cũ.
 *  Made by Yohu 💛
 * ================================================================
 */

const KT = {
  VERSION: "3.0.0 (14/10/2026)",
  TZ: "Asia/Ho_Chi_Minh",
  S: {
    CFG: "KT_Cau_Hinh",
    TK: "KT_He_Thong_TK",
    CT: "KT_Chung_Tu",
    SDDK: "KT_So_Du_Dau_Ky",
    TDK: "KT_Ton_Dau_Ky",
    NGANH: "KT_Nganh_Hang",
    KY: "KT_Nhat_Ky_Ky",
    CANH_BAO: "KT_Canh_Bao"
  },
  SRC: {
    DON: "Don_Hang_Chi_Tiet", SP: "San_pham", NHAP: "Nhap_hang", CP: "Chi_phi",
    CN: "So_Cong_No", KH: "Khach_Hang", NCC: "Nha_Cung_Cap"
  },
  // Loại chứng từ
  LOAI_CT: {
    PT: "Phiếu thu", PC: "Phiếu chi", BC: "Giấy báo Có (thu qua ngân hàng)",
    BN: "Giấy báo Nợ (chi qua ngân hàng)", PNK: "Phiếu nhập kho", PXK: "Phiếu xuất kho",
    BT: "Phiếu kế toán (bút toán khác)"
  },
  // Header sheet chứng từ
  CT_HEADER: ["Số CT", "Loại", "Ngày", "Mã đối tượng", "Tên đối tượng", "Địa chỉ", "Lý do / Diễn giải",
    "Số tiền", "TK Nợ", "TK Có", "Nguồn", "Khóa nguồn", "Kèm theo", "Trạng thái ký", "Mã xác thực",
    "File PDF", "Người tạo", "Thời gian tạo", "Chi tiết (JSON)"]
};

// Ngành nghề — tỷ lệ % trên doanh thu (hộ/cá nhân kinh doanh, nhóm doanh thu > ngưỡng đến 3 tỷ).
// Nguồn: Luật Thuế GTGT 2024 (Điều 12), Luật Thuế TNCN 2025 (Điều 7) — xem lại khi có văn bản mới.
const KT_NGANH = {
  PHAN_PHOI: { ten: "Phân phối, cung cấp hàng hóa", gtgt: 0.01, tncn: 0.005 },
  SX_VT_DV_HH: { ten: "Sản xuất, vận tải, dịch vụ có gắn với hàng hóa, xây dựng có bao thầu NVL", gtgt: 0.03, tncn: 0.015 },
  DICH_VU: { ten: "Dịch vụ, xây dựng không bao thầu nguyên vật liệu", gtgt: 0.05, tncn: 0.02 },
  CHO_THUE_TS: { ten: "Cho thuê tài sản, đại lý bảo hiểm/xổ số/bán hàng đa cấp", gtgt: 0.05, tncn: 0.05 },
  KHAC: { ten: "Hoạt động kinh doanh khác", gtgt: 0.02, tncn: 0.01 }
};

// Cấu hình mặc định: [khóa, giá trị, mô tả, lựa chọn]
const KT_CFG_DEFAULT = [
  ["LOAI_HINH", "HKD", "Loại hình: HKD = Hộ/cá nhân kinh doanh (TT152/2025); DNSN = DN siêu nhỏ (TT58/2026); DNN = DN nhỏ và vừa (TT133/2016)", "HKD,DNSN,DNN"],
  ["TEN_DON_VI", "", "Tên hộ kinh doanh / doanh nghiệp (in trên sổ, chứng từ, báo cáo)", ""],
  ["DIA_CHI", "", "Địa chỉ trụ sở / địa điểm kinh doanh", ""],
  ["MST", "", "Mã số thuế", ""],
  ["DIEN_THOAI", "", "Điện thoại / Zalo", ""],
  ["NGUOI_DAI_DIEN", "", "Chủ hộ / Giám đốc (người đại diện)", ""],
  ["KE_TOAN_TRUONG", "", "Kế toán trưởng / người phụ trách kế toán", ""],
  ["THU_QUY", "", "Thủ quỹ", ""],
  ["THU_KHO", "", "Thủ kho", ""],
  ["NGUOI_LAP", "", "Người lập phiếu / lập biểu", ""],
  ["NOI_LAP", "", "Nơi lập (ví dụ: TP. Hưng Yên) — in ở dòng ngày tháng", ""],
  ["NGAY_BAT_DAU", "01/01/2026", "Ngày bắt đầu ghi sổ trên phần mềm (dd/MM/yyyy). Số dư đầu kỳ tính tại ngày này", ""],
  ["NGANH_MAC_DINH", "PHAN_PHOI", "Ngành nghề chính (quyết định tỷ lệ % thuế): PHAN_PHOI, SX_VT_DV_HH, DICH_VU, CHO_THUE_TS, KHAC", "PHAN_PHOI,SX_VT_DV_HH,DICH_VU,CHO_THUE_TS,KHAC"],
  ["HKD_NGUONG_DOANH_THU", 1000000000, "HKD: ngưỡng doanh thu năm không chịu thuế GTGT, không nộp TNCN (đồng). Hiện hành: 1 tỷ", ""],
  ["HKD_PP_TNCN", "TY_LE", "HKD nhóm >ngưỡng–3 tỷ: TY_LE = TNCN theo % doanh thu (sổ S2a); THU_NHAP = theo thu nhập tính thuế (sổ S2b–S2e). DT > 3 tỷ luôn THU_NHAP", "TY_LE,THU_NHAP"],
  ["DNSN_PP_THUE", 2, "DN siêu nhỏ (TT58): 1 = GTGT% + TNDN%; 2 = GTGT% + TNDN theo thu nhập; 3 = GTGT khấu trừ + TNDN%; 4 = GTGT khấu trừ + TNDN theo thu nhập", "1,2,3,4"],
  ["DNSN_TY_LE_TNDN", 0.01, "DN siêu nhỏ nộp TNDN theo % doanh thu (PP 1, 3): tỷ lệ — KIỂM TRA LẠI theo văn bản hướng dẫn hiện hành", ""],
  ["DN_PP_GTGT", "KHAU_TRU", "DNN (TT133): phương pháp GTGT: KHAU_TRU hoặc TRUC_TIEP", "KHAU_TRU,TRUC_TIEP"],
  ["THUE_SUAT_GTGT_BAN", 0.1, "Thuế suất GTGT đầu ra khi khấu trừ (0.1 = 10%, 0.08 = 8%, 0.05 = 5%)", ""],
  ["GIA_BAN_DA_GOM_VAT", "CO", "Giá bán trong đơn hàng ĐÃ gồm thuế GTGT? (CO/KHONG) — chỉ dùng khi khấu trừ", "CO,KHONG"],
  ["THUE_SUAT_GTGT_MUA", 0, "Thuế suất GTGT đầu vào của hàng nhập (có hóa đơn GTGT). 0 nếu không có hóa đơn", ""],
  ["GIA_NHAP_DA_GOM_VAT", "CO", "Giá nhập trong sheet Nhap_hang ĐÃ gồm thuế GTGT? (CO/KHONG)", "CO,KHONG"],
  ["THUE_SUAT_TNDN", "AUTO", "DN: thuế suất TNDN. AUTO = 15% (DT năm ≤ 3 tỷ), 17% (≤ 50 tỷ), 20% (còn lại) — Luật TNDN 2025", ""],
  ["TK_THU_TIEN_BAN_HANG", "1111", "Đơn hàng không ghi nhận bán chịu thì coi là đã thu bằng: 1111 = tiền mặt, 1121 = chuyển khoản", "1111,1121"],
  ["TK_TRA_TIEN_MUA_HANG", "1111", "Phiếu nhập không ghi nhận mua chịu thì coi là đã trả bằng: 1111 / 1121", "1111,1121"],
  ["SCA_MOI_TRUONG", "UAT", "Ký số VNPT SmartCA: UAT = thử nghiệm, PROD = thật", "UAT,PROD"],
  ["SCA_USER_ID", "", "Ký số VNPT SmartCA: số CCCD / MST của người ký (đã đăng ký SmartCA)", ""]
];

// Hệ thống tài khoản dùng trong phần mềm (theo TT133/2016, rút gọn cho DN nhỏ)
// [Số TK, Tên, Tính chất: N = dư Nợ, C = dư Có, L = lưỡng tính, KQ = tài khoản kết quả]

// ========================= TIỆN ÍCH =========================
function kt_num(v) {
  if (typeof v === "number") return isFinite(v) ? v : 0;
  if (v === null || v === undefined) return 0;
  let s = String(v).trim().replace(/\s|đ|₫|vnd/gi, "");
  if (!s || s.charAt(0) === "=") return 0;
  if (/^-?\d{1,3}([.,]\d{3})+$/.test(s)) s = s.replace(/[.,]/g, "");      // 1.234.000 hoặc 1,234,000
  else if (/^-?\d+,\d+$/.test(s)) s = s.replace(",", ".");                  // 12,5
  else s = s.replace(/,/g, "");
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function kt_round(n) { return Math.round((Number(n) || 0)); }

// Chuyển mọi kiểu ngày (Date, "dd/MM/yyyy [HH:mm[:ss]]", ISO, số serial Sheets) -> Date. Sai -> null
function kt_date(v) {
  if (v === null || v === undefined || v === "") return null;
  if (Object.prototype.toString.call(v) === "[object Date]") return isNaN(v.getTime()) ? null : v;
  if (typeof v === "number") { // serial Google Sheets/Excel
    if (v > 20000 && v < 80000) return new Date(Math.round((v - 25569) * 86400000) + new Date().getTimezoneOffset() * 60000);
    return null;
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?\s+(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/); // "10:41:33 12/6/2026"
  if (m) {
    const d = new Date(+m[6], +m[5] - 1, +m[4], +m[1], +m[2], +(m[3] || 0));
    return (d.getDate() === +m[4] && d.getMonth() === +m[5] - 1) ? d : null;
  }
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})(?:[ T,]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m) {
    const d = new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
    if (d.getDate() !== +m[1] || d.getMonth() !== +m[2] - 1) return null;
    return d;
  }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
  return null;
}

function kt_day0(d) { const x = new Date(d); return new Date(x.getFullYear(), x.getMonth(), x.getDate()); }
function kt_dayEnd(d) { const x = kt_day0(d); return new Date(x.getTime() + 86400000 - 1); }

function kt_pad(n, w) { return String(n).padStart(w, "0"); }
function kt_fmtDate(d) {
  if (!d) return "";
  const x = new Date(d);
  return kt_pad(x.getDate(), 2) + "/" + kt_pad(x.getMonth() + 1, 2) + "/" + x.getFullYear();
}
function kt_fmtMoney(n) {
  const r = kt_round(n);
  const s = Math.abs(r).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  return (r < 0 ? "-" : "") + s;
}
function kt_str(v) { return v === null || v === undefined ? "" : String(v).trim(); }

// Chuẩn hóa mã hàng: bỏ khoảng trắng thừa, in hoa; mã toàn số bỏ số 0 đầu (022 = 22)
function kt_code(v) {
  let s = kt_str(v).toUpperCase().replace(/\s*-\s*/g, "-").replace(/\s+/g, " ");
  if (/^\d+(\.0+)?$/.test(s)) s = String(parseInt(s, 10));
  return s;
}

function kt_isTongRow(v) { const s = kt_str(v).toUpperCase(); return s === "TỔNG" || s === "TONG" || s === "TỔNG CỘNG"; }

// Đọc số tiền bằng chữ (tiếng Việt)
function kt_docSo(so) {
  so = Math.round(Math.abs(Number(so) || 0));
  if (so === 0) return "Không đồng";
  const cs = ["không", "một", "hai", "ba", "bốn", "năm", "sáu", "bảy", "tám", "chín"];
  const doc3 = (n, du) => {
    const tr = Math.floor(n / 100), ch = Math.floor((n % 100) / 10), dv = n % 10, s = [];
    if (du || tr > 0) s.push(cs[tr] + " trăm");
    if (ch === 0) { if (dv > 0 && (du || tr > 0)) s.push("linh"); }
    else if (ch === 1) s.push("mười");
    else s.push(cs[ch] + " mươi");
    if (dv > 0) {
      if (dv === 1 && ch > 1) s.push("mốt");
      else if (dv === 5 && ch > 0) s.push("lăm");
      else if (dv === 4 && ch > 1) s.push("tư");
      else s.push(cs[dv]);
    }
    return s.join(" ");
  };
  const groups = [];
  let x = so;
  while (x > 0) { groups.push(x % 1000); x = Math.floor(x / 1000); }
  const parts = [];
  let daCo = false;
  for (let i = groups.length - 1; i >= 0; i--) {
    const g = groups[i];
    if (g === 0) continue;
    const ten = ["", " nghìn", " triệu"][i % 3] + " tỷ".repeat(Math.floor(i / 3));
    parts.push(doc3(g, daCo) + ten);
    daCo = true;
  }
  const s = parts.join(" ").replace(/\s+/g, " ").trim();
  return s.charAt(0).toUpperCase() + s.slice(1) + " đồng";
}

function kt_hash(text) {
  // SHA-256 hex. Apps Script: Utilities; Node test: crypto
  if (typeof Utilities !== "undefined") {
    const b = Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, text, Utilities.Charset.UTF_8);
    return b.map(x => ((x + 256) % 256).toString(16).padStart(2, "0")).join("");
  }
  return require("crypto").createHash("sha256").update(text, "utf8").digest("hex");
}

// Đọc cấu hình từ mảng [[khóa, giá trị,...]] -> object (bổ sung mặc định)
function kt_parseCfg(rows) {
  const cfg = {};
  KT_CFG_DEFAULT.forEach(r => { cfg[r[0]] = r[1]; });
  (rows || []).forEach(r => {
    const k = kt_str(r[0]);
    if (k && Object.prototype.hasOwnProperty.call(cfg, k) && r[1] !== "" && r[1] !== null && r[1] !== undefined) cfg[k] = r[1];
  });
  cfg.LOAI_HINH = kt_str(cfg.LOAI_HINH).toUpperCase() || "HKD";
  ["HKD_NGUONG_DOANH_THU", "DNSN_PP_THUE"].forEach(k => cfg[k] = kt_num(cfg[k]));
  ["THUE_SUAT_GTGT_BAN", "THUE_SUAT_GTGT_MUA", "DNSN_TY_LE_TNDN"].forEach(k => cfg[k] = kt_rate(cfg[k]));
  cfg.NGAY_BAT_DAU_D = kt_day0(kt_date(cfg.NGAY_BAT_DAU) || new Date(new Date().getFullYear(), 0, 1));
  if (!KT_NGANH[cfg.NGANH_MAC_DINH]) cfg.NGANH_MAC_DINH = "PHAN_PHOI";
  return cfg;
}

// "10%" -> 0.1 ; 10 -> 0.1 ; 0.1 -> 0.1
function kt_rate(v) {
  if (typeof v === "string" && v.indexOf("%") >= 0) return kt_num(v.replace("%", "")) / 100;
  const n = kt_num(v);
  return n > 1 ? n / 100 : n;
}

function kt_cfgYes(v) { const s = kt_str(v).toUpperCase(); return s === "CO" || s === "CÓ" || s === "TRUE" || s === "YES" || s === "1"; }

// Kỳ báo cáo: {loai:'nam'|'quy'|'thang'|'tuy_chon', nam, quy, thang, tu, den} -> {tu: Date, den: Date, ten}
function kt_ky(p) {
  p = p || {};
  const now = new Date();
  const nam = +p.nam || now.getFullYear();
  let tu, den, ten;
  if (p.loai === "thang") {
    const t = (+p.thang || now.getMonth() + 1) - 1;
    tu = new Date(nam, t, 1); den = kt_dayEnd(new Date(nam, t + 1, 0)); ten = "Tháng " + (t + 1) + "/" + nam;
  } else if (p.loai === "quy") {
    const q = +p.quy || Math.floor(now.getMonth() / 3) + 1;
    tu = new Date(nam, (q - 1) * 3, 1); den = kt_dayEnd(new Date(nam, q * 3, 0)); ten = "Quý " + q + "/" + nam;
  } else if (p.loai === "tuy_chon" && kt_date(p.tu) && kt_date(p.den)) {
    tu = kt_day0(kt_date(p.tu)); den = kt_dayEnd(kt_date(p.den));
    ten = "Từ " + kt_fmtDate(tu) + " đến " + kt_fmtDate(den);
  } else {
    tu = new Date(nam, 0, 1); den = kt_dayEnd(new Date(nam, 11, 31)); ten = "Năm " + nam;
  }
  return { tu: tu, den: den, ten: ten, nam: tu.getFullYear() };
}

// ================== ĐỌC DỮ LIỆU NGUỒN (thuần, không gọi Sheets) ==================
// raw = { don, sp, nhap, cp, cn, kh, ncc, ct, sddk, tdk, nganh } — mỗi phần là mảng 2 chiều getValues()
function kt_findHeader(values, labels, maxScan) {
  const L = labels.map(x => x.toLowerCase());
  for (let i = 0; i < Math.min(values.length, maxScan || 12); i++) {
    const row = values[i].map(c => kt_str(c).toLowerCase());
    if (L.every(l => row.some(c => c.indexOf(l) >= 0))) return i;
  }
  return -1;
}

function kt_parseSources(raw) {
  const out = { orders: [], products: {}, imports: [], expenses: [], debts: [], customers: {}, suppliers: {},
    manual: [], ctExisting: [], sddk: [], tdk: [], nganhMap: {}, warnings: [] };
  const W = (loai, ma, chiTiet, goiY) => out.warnings.push({ loai: loai, ma: ma || "", chiTiet: chiTiet, goiY: goiY || "" });

  // --- Sản phẩm (header "Mã hàng" + "Tên hàng", dữ liệu ngay dưới)
  const sp = raw.sp || [];
  let h = kt_findHeader(sp, ["mã hàng", "tên hàng"]);
  for (let i = (h >= 0 ? h + 1 : 5); i < sp.length; i++) {
    const r = sp[i];
    if (kt_isTongRow(r[0])) continue;
    const ma = kt_code(r[0]);
    if (!ma) continue;
    if (!out.products[ma]) {
      out.products[ma] = { ma: ma, ten: kt_str(r[1]), dvt: (isNaN(Number(r[2])) || kt_str(r[2]) === "") ? (kt_str(r[2]) || "Cái") : "Cái",
        slDau: 0, giaNhap: kt_num(r[4]), giaBan: kt_num(r[7]) };
    } else {
      W("Mã hàng trùng trong San_pham", ma, "Dòng " + (i + 1) + " trùng mã với dòng trước", "Gộp thành 1 dòng");
    }
    out.products[ma].slDau += kt_num(r[3]);
  }

  // --- Đơn hàng chi tiết (header dòng 1)
  const don = raw.don || [];
  h = kt_findHeader(don, ["mã đơn", "thành tiền"]);
  const byOrder = {};
  for (let i = (h >= 0 ? h + 1 : 1); i < don.length; i++) {
    const r = don[i];
    const maDon = kt_str(r[1]).toUpperCase();
    if (!maDon) continue;
    const ngay = kt_date(r[0]);
    if (!ngay) { W("Ngày đơn hàng không đọc được", maDon, "Don_Hang_Chi_Tiet dòng " + (i + 1) + ": \"" + kt_str(r[0]) + "\"", "Sửa cột Thời gian về dạng ngày giờ"); continue; }
    if (!byOrder[maDon]) {
      byOrder[maDon] = { maDon: maDon, ngay: ngay, tenKH: kt_str(r[2]), donVi: kt_str(r[3]), mst: kt_str(r[4]),
        sdt: kt_str(r[5]), diaChi: kt_str(r[6]), lines: [], tong: 0 };
      out.orders.push(byOrder[maDon]);
    }
    const o = byOrder[maDon];
    const ma = kt_code(r[7]);
    const sl = kt_num(r[10]);
    const gia = kt_num(r[11]);
    let tt = kt_num(r[12]);
    if (!tt && sl && gia) tt = sl * gia;
    o.lines.push({ ma: ma, ten: kt_str(r[8]) || (out.products[ma] ? out.products[ma].ten : ma), dvt: kt_str(r[9]) || "Cái", sl: sl, gia: gia, tt: tt });
    o.tong += tt;
    if (ma && !out.products[ma]) W("Mã trong đơn KHÔNG có trong San_pham", ma, "Đơn " + maDon + " — giá vốn tính bằng 0, lợi nhuận bị cao hơn thực tế", "Thêm mã vào San_pham và nhập giá vốn (Nhap_hang hoặc KT_Ton_Dau_Ky)");
  }

  // --- Nhập hàng (header "Ngày nhập")
  const nhap = raw.nhap || [];
  h = kt_findHeader(nhap, ["ngày nhập", "mã hàng"]);
  for (let i = (h >= 0 ? h + 1 : 5); i < nhap.length; i++) {
    const r = nhap[i];
    const ma = kt_code(r[1]);
    if (!ma || kt_isTongRow(r[0])) continue;
    const ngay = kt_date(r[0]);
    const sl = kt_num(r[4]), gia = kt_num(r[5]);
    if (!ngay || !sl) { W("Dòng nhập hàng thiếu ngày/số lượng", ma, "Nhap_hang dòng " + (i + 1), "Bổ sung ngày nhập và số lượng"); continue; }
    let gt = kt_num(r[6]);
    if (!gt) gt = sl * gia;
    const maNhap = kt_str(r[7]).toUpperCase() || ("NH-" + kt_fmtDate(ngay) + "-" + ma);
    out.imports.push({ ngay: ngay, ma: ma, ten: kt_str(r[2]) || (out.products[ma] ? out.products[ma].ten : ma), dvt: kt_str(r[3]) || "Cái",
      sl: sl, gia: gia || (gt / sl), gt: gt, maNhap: maNhap, dong: i + 1 });
  }

  // --- Chi phí (header "Diễn giải" + "Số tiền")
  const cp = raw.cp || [];
  h = kt_findHeader(cp, ["diễn giải", "số tiền"]);
  const dem = {};
  for (let i = (h >= 0 ? h + 1 : 5); i < cp.length; i++) {
    const r = cp[i];
    const ngay = kt_date(r[0]);
    const tien = kt_num(r[2]);
    if (!ngay || tien <= 0) continue;
    const dg = kt_str(r[1]);
    const ghiChu = (kt_str(r[3]) + " " + kt_str(r[4])).trim();
    let khoa = "CP|" + kt_fmtDate(ngay) + "|" + dg + "|" + kt_round(tien);
    dem[khoa] = (dem[khoa] || 0) + 1;
    if (dem[khoa] > 1) khoa += "|" + dem[khoa];
    const chuaTT = /chưa\s*(tt|thanh toán|trả)/i.test(ghiChu + " " + dg);
    out.expenses.push({ ngay: ngay, dienGiai: dg, tien: tien, nguoiChi: kt_str(r[3]), ghiChu: kt_str(r[4]), khoa: khoa, chuaTT: chuaTT, dong: i + 1 });
    if (/(^|\s)(quỹ|góp vốn|cọc|ký quỹ|tạm ứng|cho vay|vay)(\s|$|,)/i.test(dg))
      W("Chi phí có thể ghi sai bản chất", "", "Chi_phi dòng " + (i + 1) + ": \"" + dg + "\" " + kt_fmtMoney(tien) + "đ", "Nếu là nộp quỹ/góp vốn/tiền cọc/tạm ứng: xóa khỏi Chi_phi và lập Phiếu chi/Phiếu thu với TK phù hợp (141, 244, 4111...)");
  }

  // --- Công nợ (module V2): sheet So_Cong_No
  const cn = raw.cn || [];
  for (let i = 1; i < cn.length; i++) {
    const r = cn[i];
    const loai = kt_str(r[1]).toUpperCase();
    const ngay = kt_date(r[0]);
    if (!loai || !ngay) continue;
    out.debts.push({ ngay: ngay, loai: loai, ma: kt_str(r[2]), ten: kt_str(r[3]), soCT: kt_str(r[4]).toUpperCase(),
      tien: kt_num(r[5]), han: kt_date(r[6]), hinhThuc: kt_str(r[7]), dienGiai: kt_str(r[8]), maGD: kt_str(r[10]) || ("CN|" + i), dong: i + 1 });
  }
  const readDT = (vals, target) => (vals || []).slice(1).forEach(r => {
    const ma = kt_str(r[0]); if (!ma) return;
    target[ma] = { ma: ma, ten: kt_str(r[1]), mst: kt_str(r[2]), sdt: kt_str(r[3]), diaChi: kt_str(r[4]) };
  });
  readDT(raw.kh, out.customers);
  readDT(raw.ncc, out.suppliers);

  // --- Chứng từ đã có (KT_Chung_Tu): header dòng 1
  const ct = raw.ct || [];
  for (let i = 1; i < ct.length; i++) {
    const r = ct[i];
    const soCT = kt_str(r[0]);
    if (!soCT) continue;
    const rec = { soCT: soCT, loai: kt_str(r[1]).toUpperCase(), ngay: kt_date(r[2]), maDT: kt_str(r[3]), tenDT: kt_str(r[4]),
      diaChi: kt_str(r[5]), lyDo: kt_str(r[6]), tien: kt_num(r[7]), tkNo: kt_str(r[8]), tkCo: kt_str(r[9]),
      nguon: kt_str(r[10]).toUpperCase(), khoa: kt_str(r[11]), kemTheo: kt_str(r[12]), trangThaiKy: kt_str(r[13]),
      maXacThuc: kt_str(r[14]), filePDF: kt_str(r[15]), nguoiTao: kt_str(r[16]), tgTao: r[17], chiTietJSON: kt_str(r[18]), dong: i + 1 };
    out.ctExisting.push(rec);
    if (rec.nguon === "THU_CONG") out.manual.push(rec);
  }

  // --- Số dư đầu kỳ tài khoản: [TK, Dư Nợ, Dư Có, Mã đối tượng, Ghi chú]
  (raw.sddk || []).slice(1).forEach((r, i) => {
    const tk = kt_str(r[0]).replace(/\.0$/, "");
    if (!tk || !/^\d{3,5}$/.test(tk)) return;
    const no = kt_num(r[1]), co = kt_num(r[2]);
    if (no || co) out.sddk.push({ tk: tk, no: no, co: co, dt: kt_str(r[3]) });
  });
  // --- Tồn kho đầu kỳ: [Mã hàng, Tên hàng, ĐVT, Số lượng, Đơn giá, Thành tiền]
  (raw.tdk || []).slice(1).forEach(r => {
    const ma = kt_code(r[0]);
    const sl = kt_num(r[3]);
    if (!ma || !sl) return;
    const gia = kt_num(r[4]) || (kt_num(r[5]) / sl);
    out.tdk.push({ ma: ma, ten: kt_str(r[1]) || (out.products[ma] ? out.products[ma].ten : ma), dvt: kt_str(r[2]) || "Cái", sl: sl, gia: gia });
  });
  // --- Ngành theo mã hàng (tùy chọn): [Mã hàng hoặc tiền tố*, Mã ngành]
  (raw.nganh || []).slice(1).forEach(r => {
    const ma = kt_code(r[0]); const ng = kt_str(r[1]).toUpperCase();
    if (ma && KT_NGANH[ng]) out.nganhMap[ma] = ng;
  });

  out.orders.sort((a, b) => a.ngay - b.ngay);
  out.imports.sort((a, b) => a.ngay - b.ngay);
  out.expenses.sort((a, b) => a.ngay - b.ngay);
  return out;
}

// Gợi ý tồn đầu kỳ từ San_pham: SL đầu kỳ (cột D đã cộng dồn hàng nhập) − tổng SL trong Nhap_hang
function kt_goiYTonDauKy(src) {
  const nhapSL = {};
  src.imports.forEach(x => nhapSL[x.ma] = (nhapSL[x.ma] || 0) + x.sl);
  const rows = [];
  Object.keys(src.products).forEach(ma => {
    const p = src.products[ma];
    const sl = p.slDau - (nhapSL[ma] || 0);
    if (sl > 0) rows.push([p.ma, p.ten, p.dvt, sl, p.giaNhap, kt_round(sl * p.giaNhap)]);
  });
  return rows;
}

function kt_nganhCua(ma, src, cfg) {
  if (src.nganhMap[ma]) return src.nganhMap[ma];
  const keys = Object.keys(src.nganhMap).filter(k => k.slice(-1) === "*" && ma.indexOf(k.slice(0, -1)) === 0);
  if (keys.length) return src.nganhMap[keys[0]];
  return cfg.NGANH_MAC_DINH;
}

// =====================================================================
//  ĐỘNG CƠ HẠCH TOÁN: từ dữ liệu bán hàng / nhập hàng / chi phí / công nợ
//  / chứng từ thủ công -> bút toán kép (Nợ/Có) + chứng từ đánh số tự động
//  Hàm THUẦN (không gọi Sheets) để dễ kiểm thử.
// =====================================================================
function kt_isKhauTru(cfg) {
  if (cfg.LOAI_HINH === "DNN") return kt_str(cfg.DN_PP_GTGT).toUpperCase() === "KHAU_TRU";
  if (cfg.LOAI_HINH === "DNSN") return cfg.DNSN_PP_THUE === 3 || cfg.DNSN_PP_THUE === 4;
  return false;
}

function kt_tkTen(tk) {
  const r = KT_TK.find(x => x[0] === tk);
  return r ? r[1] : "";
}

function kt_buildJournal(src, cfg) {
  const start = cfg.NGAY_BAT_DAU_D;
  const khauTru = kt_isKhauTru(cfg);
  const rBan = khauTru ? cfg.THUE_SUAT_GTGT_BAN : 0;
  const rMua = khauTru ? cfg.THUE_SUAT_GTGT_MUA : 0;
  const giaBanGomVAT = kt_cfgYes(cfg.GIA_BAN_DA_GOM_VAT);
  const giaNhapGomVAT = kt_cfgYes(cfg.GIA_NHAP_DA_GOM_VAT);
  const tkThuBan = kt_str(cfg.TK_THU_TIEN_BAN_HANG) === "1121" ? "1121" : "1111";
  const tkTraMua = kt_str(cfg.TK_TRA_TIEN_MUA_HANG) === "1121" ? "1121" : "1111";
  const TK_HOP_LE = {};
  KT_TK.forEach(t => TK_HOP_LE[t[0]] = true);

  const pairs = [], vouchers = [], stockMoves = [], warnings = src.warnings.slice();
  const W = (loai, ma, chiTiet, goiY) => warnings.push({ loai: loai, ma: ma || "", chiTiet: chiTiet, goiY: goiY || "" });

  // ---------- Đánh số chứng từ ổn định giữa các lần chạy ----------
  const mapKhoa = {}, maxSeq = {};
  src.ctExisting.forEach(c => {
    if (c.khoa) mapKhoa[c.loai + "|" + c.khoa] = c.soCT;
    const m = c.soCT.match(/^([A-Z]+)(\d{2})-(\d+)$/);
    if (m) { const k = m[1] + m[2]; maxSeq[k] = Math.max(maxSeq[k] || 0, +m[3]); }
  });
  const soCT = (loai, ngay, khoa) => {
    const fk = loai + "|" + khoa;
    if (mapKhoa[fk]) return mapKhoa[fk];
    const k = loai + String(ngay.getFullYear()).slice(-2);
    maxSeq[k] = (maxSeq[k] || 0) + 1;
    return (mapKhoa[fk] = k + "-" + kt_pad(maxSeq[k], 4));
  };
  const P = (ngay, so, loaiCT, dg, no, co, tien, o) => {
    tien = kt_round(tien);
    if (!tien) return;
    o = o || {};
    pairs.push({ ngay: ngay, soCT: so, loaiCT: loaiCT, dienGiai: dg, no: no, co: co, tien: tien,
      dtNo: o.dtNo || "", dtCo: o.dtCo || "", tenDT: o.tenDT || "", nguon: o.nguon || "", ma: o.ma || "", sl: o.sl || 0, ctKho: o.ctKho || "" });
  };
  const V = (v) => { v.tien = kt_round(v.tien); vouchers.push(v); return v; };
  const loaiTien = tk => (tk === "1121" ? { thu: "BC", chi: "BN" } : { thu: "PT", chi: "PC" });

  // ---------- Số dư đầu kỳ (dạng số dư, không phải bút toán) ----------
  const opening = {};       // tk -> số dư Nợ (âm = dư Có)
  const openingDT = {};     // "131|KH001" -> số dư Nợ
  const addOpen = (tk, so, dt) => {
    opening[tk] = (opening[tk] || 0) + so;
    if (dt && (tk === "131" || tk === "331")) openingDT[tk + "|" + dt] = (openingDT[tk + "|" + dt] || 0) + so;
  };
  const stock = {};         // ma -> {sl, gt, gia}
  const prodInfo = ma => src.products[ma] || { ma: ma, ten: ma, dvt: "Cái", giaNhap: 0 };
  let tdkTong = 0;
  src.tdk.forEach(t => {
    const gt = kt_round(t.sl * t.gia);
    stock[t.ma] = stock[t.ma] || { sl: 0, gt: 0, gia: t.gia };
    stock[t.ma].sl += t.sl; stock[t.ma].gt += gt; stock[t.ma].gia = t.gia;
    tdkTong += gt;
    stockMoves.push({ ma: t.ma, ten: t.ten, dvt: t.dvt, ngay: new Date(start.getTime() - 1000), soCT: "", dienGiai: "Tồn đầu kỳ",
      loai: "DAU", sl: t.sl, gia: t.gia, gt: gt, slTon: stock[t.ma].sl, gtTon: stock[t.ma].gt });
  });
  let co1561TrongSDDK = false;
  src.sddk.forEach(s => {
    if (s.tk === "1561" && src.tdk.length) { co1561TrongSDDK = true; return; }
    if (!TK_HOP_LE[s.tk]) { W("Số dư đầu kỳ: tài khoản không có trong danh mục", s.tk, "KT_So_Du_Dau_Ky", "Dùng tài khoản trong sheet KT_He_Thong_TK"); return; }
    addOpen(s.tk, s.no - s.co, s.dt);
  });
  if (co1561TrongSDDK) W("Số dư 1561 bị trùng", "1561", "Đã có KT_Ton_Dau_Ky nên bỏ qua dòng 1561 trong KT_So_Du_Dau_Ky", "Chỉ khai tồn kho ở KT_Ton_Dau_Ky");
  if (tdkTong) addOpen("1561", tdkTong);
  // Cân đối số dư đầu kỳ: chênh lệch đưa vào 4111 (vốn chủ sở hữu)
  const lechDK = Object.keys(opening).reduce((s, k) => s + opening[k], 0);
  if (Math.abs(lechDK) >= 1) {
    addOpen("4111", -lechDK);
    if (src.sddk.length) W("Số dư đầu kỳ chưa cân", "4111", "Tổng dư Nợ − dư Có = " + kt_fmtMoney(lechDK) + "đ", "Đã tự ghi phần chênh lệch vào 4111 (vốn chủ sở hữu). Kiểm tra lại KT_So_Du_Dau_Ky");
  }

  // ---------- Khớp công nợ với đơn hàng / phiếu nhập ----------
  const phaiThuTheoDon = {}, phaiTraTheoNhap = {};
  src.debts.forEach(d => {
    if (d.loai === "PHAI_THU" && d.soCT) phaiThuTheoDon[d.soCT] = d;
    if (d.loai === "PHAI_TRA" && d.soCT) phaiTraTheoNhap[d.soCT] = d;
  });
  const daKhop = {};

  // ---------- Gom sự kiện theo thời gian ----------
  const ev = [];
  const groupNhap = {};
  src.imports.forEach(x => {
    const k = x.maNhap;
    if (!groupNhap[k]) { groupNhap[k] = { maNhap: k, ngay: x.ngay, lines: [] }; ev.push({ ngay: x.ngay, ut: 1, t: "NHAP", d: groupNhap[k] }); }
    groupNhap[k].lines.push(x);
  });
  src.orders.forEach(o => ev.push({ ngay: o.ngay, ut: 2, t: "DON", d: o }));
  src.debts.forEach(d => ev.push({ ngay: d.ngay, ut: 3, t: "CN", d: d }));
  src.expenses.forEach(e => ev.push({ ngay: e.ngay, ut: 3, t: "CP", d: e }));
  src.manual.forEach(m => { if (m.ngay) ev.push({ ngay: m.ngay, ut: 3, t: "TC", d: m }); });
  ev.sort((a, b) => (kt_day0(a.ngay) - kt_day0(b.ngay)) || (a.ut - b.ut) || (a.ngay - b.ngay));

  let boQua = 0;
  ev.forEach(e => {
    if (e.ngay < start) { boQua++; return; }
    const ngay = e.ngay;

    if (e.t === "NHAP") {
      const g = e.d;
      const debt = phaiTraTheoNhap[g.maNhap];
      let tkCo = tkTraMua, dt = "", tenDT = "Nhà cung cấp";
      if (debt) { tkCo = "331"; dt = debt.ma; tenDT = debt.ten; daKhop[debt.maGD] = true; }
      const cash = tkCo !== "331";
      const soPNK = soCT("PNK", ngay, g.maNhap);
      const soTien = cash ? soCT(loaiTien(tkCo).chi, ngay, g.maNhap) : "";
      let tong = 0;
      const chiTiet = [];
      g.lines.forEach(l => {
        let net = l.gt, vat = 0;
        if (rMua) { if (giaNhapGomVAT) { net = l.gt / (1 + rMua); vat = l.gt - net; } else { vat = l.gt * rMua; } }
        net = kt_round(net); vat = kt_round(vat);
        P(ngay, cash ? soTien : soPNK, "NHAP", "Nhập kho " + l.ten + " (" + g.maNhap + ")", "1561", tkCo, net,
          { dtCo: dt, tenDT: tenDT, nguon: "NHAP_HANG", ma: l.ma, sl: l.sl, ctKho: soPNK });
        if (vat) P(ngay, cash ? soTien : soPNK, "NHAP", "Thuế GTGT đầu vào " + g.maNhap, "1331", tkCo, vat, { dtCo: dt, tenDT: tenDT, nguon: "NHAP_HANG" });
        tong += net + vat;
        const st = stock[l.ma] = stock[l.ma] || { sl: 0, gt: 0, gia: l.gia };
        st.sl += l.sl; st.gt += net; st.gia = st.sl > 0 ? st.gt / st.sl : (net / l.sl);
        stockMoves.push({ ma: l.ma, ten: l.ten, dvt: l.dvt, ngay: ngay, soCT: soPNK, dienGiai: "Nhập kho (" + g.maNhap + ")",
          loai: "NHAP", sl: l.sl, gia: net / l.sl, gt: net, slTon: st.sl, gtTon: st.gt });
        chiTiet.push({ ma: l.ma, ten: l.ten, dvt: l.dvt, sl: l.sl, gia: kt_round(net / l.sl), tt: net });
      });
      V({ soCT: soPNK, loai: "PNK", ngay: ngay, maDT: dt, tenDT: tenDT, diaChi: "", lyDo: "Nhập kho hàng hóa theo mã nhập " + g.maNhap,
        tien: tong, tkNo: "1561" + (rMua ? ",1331" : ""), tkCo: tkCo, nguon: "NHAP_HANG", khoa: g.maNhap, kemTheo: "", chiTiet: chiTiet });
      if (cash) V({ soCT: soTien, loai: loaiTien(tkCo).chi, ngay: ngay, maDT: dt, tenDT: tenDT, diaChi: "",
        lyDo: "Chi tiền mua hàng theo phiếu nhập " + soPNK, tien: tong, tkNo: "1561" + (rMua ? ",1331" : ""), tkCo: tkCo,
        nguon: "NHAP_HANG", khoa: g.maNhap, kemTheo: "Phiếu nhập " + soPNK, chiTiet: [] });
    }

    else if (e.t === "DON") {
      const o = e.d;
      const debt = phaiThuTheoDon[o.maDon];
      let tkNo = tkThuBan, dt = "", tenDT = o.donVi || o.tenKH;
      if (debt) { tkNo = "131"; dt = debt.ma; tenDT = debt.ten || tenDT; daKhop[debt.maGD] = true; }
      const cash = tkNo !== "131";
      const soThu = cash ? soCT(loaiTien(tkNo).thu, ngay, o.maDon) : "";
      const soPXK = soCT("PXK", ngay, o.maDon);
      const soGhi = cash ? soThu : o.maDon;
      let tong = 0, vatTong = 0;
      const chiTiet = [];
      o.lines.forEach(l => {
        let net = l.tt, vat = 0;
        if (rBan) { if (giaBanGomVAT) { net = l.tt / (1 + rBan); vat = l.tt - net; } else { vat = l.tt * rBan; } }
        net = kt_round(net); vat = kt_round(vat);
        const tkDT = kt_nganhCua(l.ma, src, cfg) === "DICH_VU" ? "5113" : "5111";
        P(ngay, soGhi, "BAN", "Bán hàng đơn " + o.maDon + " - " + (o.tenKH || ""), tkNo, tkDT, net,
          { dtNo: dt, tenDT: tenDT, nguon: "DON_HANG", ma: l.ma, sl: l.sl });
        if (vat) P(ngay, soGhi, "BAN", "Thuế GTGT đầu ra đơn " + o.maDon, tkNo, "33311", vat, { dtNo: dt, tenDT: tenDT, nguon: "DON_HANG" });
        tong += net + vat; vatTong += vat;
        // Giá vốn (bình quân gia quyền di động)
        const coKho = !!stock[l.ma] || !!src.products[l.ma];
        if (l.ma && coKho && l.sl) {
          const st = stock[l.ma] = stock[l.ma] || { sl: 0, gt: 0, gia: prodInfo(l.ma).giaNhap };
          const gia = st.sl > 0 ? st.gt / st.sl : (st.gia || prodInfo(l.ma).giaNhap || 0);
          if (st.sl < l.sl) W("Xuất kho vượt tồn (âm kho)", l.ma, "Đơn " + o.maDon + " ngày " + kt_fmtDate(ngay) + ": xuất " + l.sl + ", tồn " + st.sl, "Kiểm tra tồn đầu kỳ (KT_Ton_Dau_Ky) hoặc phiếu nhập còn thiếu");
          const gv = kt_round(gia * l.sl);
          if (!gia) W("Chưa có giá vốn", l.ma, "Đơn " + o.maDon + " — giá vốn = 0", "Nhập giá vốn ở KT_Ton_Dau_Ky hoặc Nhap_hang");
          P(ngay, soPXK, "GIA_VON", "Giá vốn hàng bán đơn " + o.maDon, "632", "1561", gv, { nguon: "DON_HANG", ma: l.ma, sl: l.sl, ctKho: soPXK });
          st.sl -= l.sl; st.gt -= gv; st.gia = gia;
          if (st.sl <= 0) st.gt = st.sl * gia;
          stockMoves.push({ ma: l.ma, ten: l.ten, dvt: l.dvt, ngay: ngay, soCT: soPXK, dienGiai: "Xuất bán đơn " + o.maDon,
            loai: "XUAT", sl: l.sl, gia: gia, gt: gv, slTon: st.sl, gtTon: st.gt });
          chiTiet.push({ ma: l.ma, ten: l.ten, dvt: l.dvt, sl: l.sl, gia: kt_round(gia), tt: gv, giaBan: l.gia, ttBan: l.tt });
        } else {
          chiTiet.push({ ma: l.ma, ten: l.ten, dvt: l.dvt, sl: l.sl, gia: 0, tt: 0, giaBan: l.gia, ttBan: l.tt });
        }
      });
      V({ soCT: soPXK, loai: "PXK", ngay: ngay, maDT: dt, tenDT: o.tenKH, diaChi: o.diaChi, lyDo: "Xuất kho bán hàng theo đơn " + o.maDon,
        tien: chiTiet.reduce((s, c) => s + c.tt, 0), tkNo: "632", tkCo: "1561", nguon: "DON_HANG", khoa: o.maDon, kemTheo: "Đơn hàng " + o.maDon, chiTiet: chiTiet });
      if (cash) V({ soCT: soThu, loai: loaiTien(tkNo).thu, ngay: ngay, maDT: dt, tenDT: o.tenKH + (o.donVi && o.donVi !== o.tenKH ? " - " + o.donVi : ""),
        diaChi: o.diaChi, lyDo: "Thu tiền bán hàng đơn " + o.maDon, tien: tong, tkNo: tkNo, tkCo: "5111" + (vatTong ? ",33311" : ""),
        nguon: "DON_HANG", khoa: o.maDon, kemTheo: "Đơn hàng " + o.maDon, chiTiet: [] });
    }

    else if (e.t === "CN") {
      const d = e.d;
      const tk = /chuyển|ck|ngân hàng|bank/i.test(d.hinhThuc) ? "1121" : "1111";
      if (d.loai === "PHAI_THU") {
        if (!daKhop[d.maGD]) {
          P(ngay, d.soCT || d.maGD, "BAN", "Bán chịu " + (d.dienGiai || d.soCT), "131", "5111", d.tien, { dtNo: d.ma, tenDT: d.ten, nguon: "CONG_NO" });
          W("Bán chịu không khớp mã đơn hàng", d.soCT, "So_Cong_No dòng " + d.dong + ": " + d.ten + " " + kt_fmtMoney(d.tien) + "đ", "Đã ghi doanh thu 5111. Nếu trùng với 1 đơn hàng, sửa Số chứng từ = đúng mã đơn");
        }
      } else if (d.loai === "THU_TIEN") {
        const so = soCT(loaiTien(tk).thu, ngay, d.maGD);
        P(ngay, so, "THU_NO", "Thu tiền khách hàng " + d.ten + (d.soCT ? " (" + d.soCT + ")" : ""), tk, "131", d.tien, { dtCo: d.ma, tenDT: d.ten, nguon: "CONG_NO" });
        V({ soCT: so, loai: loaiTien(tk).thu, ngay: ngay, maDT: d.ma, tenDT: d.ten, diaChi: (src.customers[d.ma] || {}).diaChi || "",
          lyDo: "Thu tiền khách hàng" + (d.soCT ? " - " + d.soCT : ""), tien: d.tien, tkNo: tk, tkCo: "131", nguon: "CONG_NO", khoa: d.maGD, kemTheo: "", chiTiet: [] });
      } else if (d.loai === "PHAI_TRA") {
        if (!daKhop[d.maGD]) {
          P(ngay, d.soCT || d.maGD, "MUA", "Mua chịu " + d.ten + (d.soCT ? " (" + d.soCT + ")" : ""), "6422", "331", d.tien, { dtCo: d.ma, tenDT: d.ten, nguon: "CONG_NO" });
          W("Mua chịu không gắn phiếu nhập", d.soCT, "So_Cong_No dòng " + d.dong + ": " + d.ten + " " + kt_fmtMoney(d.tien) + "đ — đang hạch toán vào chi phí 6422", "Nếu là mua hàng hóa: ghi Số chứng từ = Mã số nhập hàng (cột H sheet Nhap_hang)");
        }
      } else if (d.loai === "TRA_TIEN") {
        const so = soCT(loaiTien(tk).chi, ngay, d.maGD);
        P(ngay, so, "TRA_NO", "Trả tiền nhà cung cấp " + d.ten + (d.soCT ? " (" + d.soCT + ")" : ""), "331", tk, d.tien, { dtNo: d.ma, tenDT: d.ten, nguon: "CONG_NO" });
        V({ soCT: so, loai: loaiTien(tk).chi, ngay: ngay, maDT: d.ma, tenDT: d.ten, diaChi: (src.suppliers[d.ma] || {}).diaChi || "",
          lyDo: "Trả tiền nhà cung cấp" + (d.soCT ? " - " + d.soCT : ""), tien: d.tien, tkNo: "331", tkCo: tk, nguon: "CONG_NO", khoa: d.maGD, kemTheo: "", chiTiet: [] });
      }
    }

    else if (e.t === "CP") {
      const c = e.d;
      if (c.chuaTT) {
        P(ngay, "CP-" + kt_fmtDate(ngay), "CHI_PHI", c.dienGiai + " (chưa thanh toán)", "6422", "3388", c.tien, { tenDT: c.nguoiChi, nguon: "CHI_PHI" });
      } else {
        const so = soCT("PC", ngay, c.khoa);
        P(ngay, so, "CHI_PHI", c.dienGiai, "6422", "1111", c.tien, { tenDT: c.nguoiChi, nguon: "CHI_PHI" });
        V({ soCT: so, loai: "PC", ngay: ngay, maDT: "", tenDT: c.nguoiChi || "", diaChi: "", lyDo: c.dienGiai, tien: c.tien,
          tkNo: "6422", tkCo: "1111", nguon: "CHI_PHI", khoa: c.khoa, kemTheo: c.ghiChu, chiTiet: [] });
      }
    }

    else if (e.t === "TC") {
      const m = e.d;
      const L = m.loai;
      let no = m.tkNo, co = m.tkCo;
      if (L === "PT") no = "1111"; else if (L === "PC") co = "1111"; else if (L === "BC") no = "1121"; else if (L === "BN") co = "1121";
      if (L === "PNK" || L === "PXK") return; // phiếu kho thủ công chỉ để in, không hạch toán (tránh trùng với Nhap_hang/đơn hàng)
      if (!TK_HOP_LE[no] || !TK_HOP_LE[co]) { W("Chứng từ thủ công sai tài khoản", m.soCT, "Nợ " + no + " / Có " + co, "Sửa TK Nợ/TK Có theo KT_He_Thong_TK"); return; }
      P(ngay, m.soCT, "THU_CONG", m.lyDo, no, co, m.tien,
        { dtNo: (no === "131" || no === "331") ? m.maDT : "", dtCo: (co === "131" || co === "331") ? m.maDT : "", tenDT: m.tenDT, nguon: "THU_CONG" });
    }
  });
  if (boQua) W("Bỏ qua dữ liệu trước ngày bắt đầu", "", boQua + " giao dịch trước " + kt_fmtDate(start), "Đổi NGAY_BAT_DAU trong KT_Cau_Hinh nếu muốn tính cả các giao dịch này");

  // Kiểm tra quỹ tiền mặt âm
  const J = { pairs: pairs, vouchers: vouchers, stockMoves: stockMoves, stock: stock, opening: opening, openingDT: openingDT, warnings: warnings, cfg: cfg, src: src };
  kt_kiemTraQuyAm_(J);
  return J;
}

function kt_kiemTraQuyAm_(J) {
  ["1111", "1121"].forEach(tk => {
    let du = J.opening[tk] || 0, canhBao = false;
    J.pairs.slice().sort((a, b) => a.ngay - b.ngay).forEach(p => {
      if (p.no === tk) du += p.tien;
      if (p.co === tk) du -= p.tien;
      if (du < -1 && !canhBao) {
        canhBao = true;
        J.warnings.push({ loai: tk === "1111" ? "Quỹ tiền mặt bị âm" : "Tiền gửi ngân hàng bị âm", ma: tk,
          chiTiet: "Từ ngày " + kt_fmtDate(p.ngay) + " (chứng từ " + p.soCT + ") số dư " + kt_fmtMoney(du) + "đ",
          goiY: "Thiếu số dư đầu kỳ hoặc vốn góp: nhập KT_So_Du_Dau_Ky (TK " + tk + ") hoặc lập Phiếu thu góp vốn (Có 4111)" });
      }
    });
  });
}

// ---------------- SỐ DƯ / PHÁT SINH ----------------
// Số dư Nợ (âm = dư Có) của mọi TK tại thời điểm `den` (bao gồm), kể từ đầu (số dư đầu kỳ + phát sinh)
function kt_soDu(J, den) {
  const b = Object.assign({}, J.opening);
  const bDT = Object.assign({}, J.openingDT);
  J.pairs.forEach(p => {
    if (den && p.ngay > den) return;
    b[p.no] = (b[p.no] || 0) + p.tien;
    b[p.co] = (b[p.co] || 0) - p.tien;
    if (p.dtNo) bDT[p.no + "|" + p.dtNo] = (bDT[p.no + "|" + p.dtNo] || 0) + p.tien;
    if (p.dtCo) bDT[p.co + "|" + p.dtCo] = (bDT[p.co + "|" + p.dtCo] || 0) - p.tien;
  });
  // Phần công nợ 131/331 không có mã đối tượng: gom vào "(chưa phân loại)"
  ["131", "331"].forEach(tk => {
    const tongDT = Object.keys(bDT).filter(k => k.indexOf(tk + "|") === 0).reduce((s, k) => s + bDT[k], 0);
    const conLai = (b[tk] || 0) - tongDT;
    if (Math.abs(conLai) >= 1) bDT[tk + "|"] = (bDT[tk + "|"] || 0) + conLai;
  });
  return { tk: b, dt: bDT };
}

function kt_phatSinh(J, tu, den) {
  const ps = {};
  J.pairs.forEach(p => {
    if (p.ngay < tu || p.ngay > den) return;
    (ps[p.no] = ps[p.no] || { no: 0, co: 0 }).no += p.tien;
    (ps[p.co] = ps[p.co] || { no: 0, co: 0 }).co += p.tien;
  });
  return ps;
}

// Doanh thu (511x) lũy kế trong khoảng
function kt_doanhThu(J, tu, den) {
  let s = 0;
  J.pairs.forEach(p => {
    if (p.ngay < tu || p.ngay > den) return;
    if (/^511/.test(p.co)) s += p.tien;
    if (/^511/.test(p.no)) s -= p.tien;
  });
  return s;
}

// =====================================================================
//  MÔ HÌNH SỔ / BÁO CÁO (dùng chung cho: ghi Sheet, trả JSON cho Web, in PDF)
//  model = { id, code, title, legal, ky, cols:[{l, c, t}], rows:[{k, c:[]}], sign:[[chức danh, ghi chú]], notes:[] }
//  k: d = dòng dữ liệu, g = tiêu đề nhóm, t = dòng tổng (đậm), n = ghi chú
//  t (kiểu cột): x = chữ, d = ngày, m = tiền, q = số lượng
// =====================================================================
const KT_LEGAL = {
  HKD: "(Kèm theo Thông tư số 152/2025/TT-BTC ngày 31/12/2025 của Bộ trưởng Bộ Tài chính)",
  DNSN: "(Kèm theo Thông tư số 58/2026/TT-BTC ngày 25/5/2026 của Bộ trưởng Bộ Tài chính)",
  DNN: "(Ban hành theo Thông tư số 133/2016/TT-BTC ngày 26/8/2016 của Bộ Tài chính)"
};

function kt_sign(cfg) {
  if (cfg.LOAI_HINH === "HKD") return [["NGƯỜI ĐẠI DIỆN HỘ KINH DOANH/\nCÁ NHÂN KINH DOANH", "(Ký, họ tên, đóng dấu nếu có)", cfg.NGUOI_DAI_DIEN]];
  if (cfg.LOAI_HINH === "DNSN") return [["NGƯỜI LẬP BIỂU", "(Ký, họ tên)", cfg.NGUOI_LAP], ["NGƯỜI ĐẠI DIỆN THEO PHÁP LUẬT", "(Ký, họ tên, đóng dấu)", cfg.NGUOI_DAI_DIEN]];
  return [["NGƯỜI LẬP BIỂU", "(Ký, họ tên)", cfg.NGUOI_LAP], ["KẾ TOÁN TRƯỞNG", "(Ký, họ tên)", cfg.KE_TOAN_TRUONG], ["GIÁM ĐỐC", "(Ký, họ tên, đóng dấu)", cfg.NGUOI_DAI_DIEN]];
}

function kt_model(cfg, ky, id, code, title, cols, rows, extra) {
  return Object.assign({ id: id, code: code, title: title, legal: code ? ("Mẫu số " + code + "\n" + (KT_LEGAL[cfg.LOAI_HINH] || "")) : "",
    ky: ky.ten, tu: kt_fmtDate(ky.tu), den: kt_fmtDate(ky.den), cols: cols, rows: rows, sign: kt_sign(cfg), notes: [],
    donVi: { ten: cfg.TEN_DON_VI, diaChi: cfg.DIA_CHI, mst: cfg.MST } }, extra || {});
}

const kt_inKy = (p, ky) => p.ngay >= ky.tu && p.ngay <= ky.den;

// ---------- Thuế HKD theo nhóm doanh thu ----------
function kt_thueSuatThuNhap(dtNam) { return dtNam <= 3e9 ? 0.15 : (dtNam <= 50e9 ? 0.17 : 0.2); }

function kt_nhomHKD(J, ky) {
  const cfg = J.cfg;
  const dauNam = new Date(ky.nam, 0, 1);
  const dtNam = kt_doanhThu(J, dauNam, ky.den);
  const nguong = cfg.HKD_NGUONG_DOANH_THU || 1e9;
  let nhom, so, ppTNCN;
  if (dtNam <= nguong) { nhom = 1; so = ["S1a"]; ppTNCN = "KHONG"; }
  else if (dtNam <= 3e9 && kt_str(cfg.HKD_PP_TNCN).toUpperCase() !== "THU_NHAP") { nhom = 2; so = ["S2a"]; ppTNCN = "TY_LE"; }
  else { nhom = dtNam <= 3e9 ? 2 : (dtNam <= 50e9 ? 3 : 4); so = ["S2b", "S2c", "S2d", "S2e"]; ppTNCN = "THU_NHAP"; }
  return { nhom: nhom, so: so, ppTNCN: ppTNCN, dtNam: dtNam, nguong: nguong };
}

// Dòng doanh thu (gom theo số chứng từ + ngành)
function kt_dongDoanhThu(J, ky) {
  const g = {};
  J.pairs.forEach(p => {
    if (!kt_inKy(p, ky)) return;
    let s = 0;
    if (/^511/.test(p.co)) s = p.tien; else if (/^511/.test(p.no)) s = -p.tien; else return;
    const ng = kt_nganhCua(p.ma, J.src, J.cfg);
    const k = ng + "|" + p.soCT;
    if (!g[k]) g[k] = { nganh: ng, soCT: p.soCT, ngay: p.ngay, dienGiai: p.dienGiai.replace(/^Bán hàng /, "Bán hàng hóa, dịch vụ "), tien: 0 };
    g[k].tien += s;
  });
  return Object.keys(g).map(k => g[k]).sort((a, b) => a.ngay - b.ngay);
}

// S1a-HKD / S1-DNSN / S2a / S2b / S3a-DNSN: Sổ doanh thu
function kt_mdlSoDoanhThu(J, ky, opt) {
  const cfg = J.cfg;
  const lines = kt_dongDoanhThu(J, ky);
  const rows = [];
  let cols;
  if (opt.mau === "S1a") {
    cols = [{ l: "Ngày, tháng", c: "A", t: "d" }, { l: "Giao dịch", c: "B", t: "x" }, { l: "Số tiền", c: "1", t: "m" }];
    let tong = 0;
    lines.forEach(x => { rows.push({ k: "d", c: [kt_fmtDate(x.ngay), x.dienGiai + " (" + x.soCT + ")", x.tien] }); tong += x.tien; });
    rows.push({ k: "t", c: ["", "Tổng cộng", tong] });
    const m = kt_model(cfg, ky, opt.id, opt.code, "SỔ DOANH THU BÁN HÀNG HÓA, DỊCH VỤ", cols, rows);
    m.notes.push("Doanh thu năm lũy kế đến " + kt_fmtDate(ky.den) + ": " + kt_fmtMoney(kt_doanhThu(J, new Date(ky.nam, 0, 1), ky.den)) + "đ. Ngưỡng không phải nộp thuế: " + kt_fmtMoney(cfg.HKD_NGUONG_DOANH_THU) + "đ/năm.");
    return m;
  }
  cols = [{ l: "Số hiệu chứng từ", c: "A", t: "x" }, { l: "Ngày, tháng", c: "B", t: "d" }, { l: "Diễn giải", c: "C", t: "x" }, { l: "Số tiền", c: "1", t: "m" }];
  const byNganh = {};
  lines.forEach(x => (byNganh[x.nganh] = byNganh[x.nganh] || []).push(x));
  const dtKy = lines.reduce((s, x) => s + x.tien, 0);
  // phần doanh thu vượt ngưỡng phát sinh trong kỳ (HKD)
  const dauNam = new Date(ky.nam, 0, 1);
  const dtTruoc = kt_doanhThu(J, dauNam, new Date(ky.tu.getTime() - 1));
  const dtCuoi = dtTruoc + dtKy;
  const ng = cfg.HKD_NGUONG_DOANH_THU || 1e9;
  const vuotKy = Math.max(0, dtCuoi - ng) - Math.max(0, dtTruoc - ng);
  const chiuGTGT = cfg.LOAI_HINH !== "HKD" ? dtKy : (dtCuoi > ng ? (dtTruoc > ng ? dtKy : dtCuoi) : 0);
  let tongGTGT = 0, tongTNCN = 0, tongTNDN = 0;
  Object.keys(byNganh).forEach(nk => {
    const N = KT_NGANH[nk];
    rows.push({ k: "g", c: ["", "", "Ngành nghề: " + N.ten + " (GTGT " + (N.gtgt * 100) + "%" + (opt.tncn ? ", TNCN " + (N.tncn * 100) + "%" : "") + ")", ""] });
    let sub = 0;
    byNganh[nk].forEach(x => { rows.push({ k: "d", c: [x.soCT, kt_fmtDate(x.ngay), x.dienGiai, x.tien] }); sub += x.tien; });
    rows.push({ k: "t", c: ["", "", "Tổng cộng (1)", sub] });
    const share = dtKy ? sub / dtKy : 0;
    if (opt.gtgt) {
      const v = kt_round(chiuGTGT * share * N.gtgt);
      tongGTGT += v;
      rows.push({ k: "t", c: ["", "", "Thuế GTGT phải nộp = (1) × " + (N.gtgt * 100) + "%" + (cfg.LOAI_HINH === "HKD" && !chiuGTGT ? " — chưa vượt ngưỡng" : ""), v] });
    }
    if (opt.tncn) {
      const v = kt_round(vuotKy * share * N.tncn);
      tongTNCN += v;
      rows.push({ k: "t", c: ["", "", "Thuế TNCN phải nộp = phần doanh thu vượt ngưỡng × " + (N.tncn * 100) + "%", v] });
    }
    if (opt.tndnTyLe) {
      const v = kt_round(sub * cfg.DNSN_TY_LE_TNDN);
      tongTNDN += v;
      rows.push({ k: "t", c: ["", "", "Thuế TNDN phải nộp = (1) × " + (cfg.DNSN_TY_LE_TNDN * 100) + "%", v] });
    }
  });
  if (!lines.length) rows.push({ k: "n", c: ["", "", "Không phát sinh doanh thu trong kỳ", 0] });
  const m = kt_model(cfg, ky, opt.id, opt.code, "SỔ DOANH THU BÁN HÀNG HÓA, DỊCH VỤ", cols, rows);
  m.tong = { doanhThu: dtKy, gtgt: tongGTGT, tncn: tongTNCN, tndn: tongTNDN };
  if (opt.tncn || (opt.gtgt && cfg.LOAI_HINH === "HKD"))
    m.notes.push("Tạm tính: doanh thu năm lũy kế " + kt_fmtMoney(dtCuoi) + "đ; ngưỡng " + kt_fmtMoney(ng) + "đ. Đối chiếu với thông báo của cơ quan thuế trước khi nộp.");
  return m;
}

// S2c-HKD / S2b-DNSN: Sổ chi tiết doanh thu, chi phí
function kt_mdlDTCP(J, ky, opt) {
  const cfg = J.cfg;
  const cols = [{ l: "Số hiệu chứng từ", c: "A", t: "x" }, { l: "Ngày, tháng", c: "B", t: "d" }, { l: "Diễn giải", c: "C", t: "x" }, { l: "Số tiền", c: "1", t: "m" }];
  const rows = [];
  const dt = {}, cp = {};
  J.pairs.forEach(p => {
    if (!kt_inKy(p, ky)) return;
    const thuNhap = tk => /^(511|515|711)/.test(tk);
    const chiPhi = tk => /^(632|635|642|811)/.test(tk);
    const add = (map, so) => { const k = p.soCT; (map[k] = map[k] || { soCT: p.soCT, ngay: p.ngay, dg: p.dienGiai, tien: 0 }).tien += so; };
    if (thuNhap(p.co)) add(dt, p.tien); if (thuNhap(p.no)) add(dt, -p.tien);
    if (chiPhi(p.no)) add(cp, p.tien); if (chiPhi(p.co)) add(cp, -p.tien);
  });
  const sortV = m => Object.keys(m).map(k => m[k]).sort((a, b) => a.ngay - b.ngay);
  rows.push({ k: "g", c: ["", "", "1. Doanh thu bán hàng hóa, dịch vụ (và thu nhập khác)", ""] });
  let t1 = 0; sortV(dt).forEach(x => { rows.push({ k: "d", c: [x.soCT, kt_fmtDate(x.ngay), x.dg, x.tien] }); t1 += x.tien; });
  rows.push({ k: "t", c: ["", "", "Tổng doanh thu (1)", t1] });
  rows.push({ k: "g", c: ["", "", "2. Chi phí hợp lý (giá vốn, chi phí kinh doanh)", ""] });
  let t2 = 0; sortV(cp).forEach(x => { rows.push({ k: "d", c: [x.soCT, kt_fmtDate(x.ngay), x.dg, x.tien] }); t2 += x.tien; });
  rows.push({ k: "t", c: ["", "", "Tổng chi phí hợp lý (2)", t2] });
  const cl = t1 - t2;
  rows.push({ k: "t", c: ["", "", "Chênh lệch (3) = (1) − (2)", cl] });
  const dtNam = kt_doanhThu(J, new Date(ky.nam, 0, 1), ky.den);
  const rate = cfg.LOAI_HINH === "HKD" ? kt_thueSuatThuNhap(dtNam) : kt_thueSuatTNDN(cfg, dtNam);
  const mienThue = cfg.LOAI_HINH === "HKD" && dtNam <= (cfg.HKD_NGUONG_DOANH_THU || 1e9);
  const thue = mienThue ? 0 : kt_round(Math.max(0, cl) * rate);
  if (mienThue) rows.push({ k: "n", c: ["", "", "Doanh thu năm lũy kế chưa vượt ngưỡng " + kt_fmtMoney(cfg.HKD_NGUONG_DOANH_THU) + "đ: không phải nộp thuế TNCN", ""] });
  rows.push({ k: "t", c: ["", "", (cfg.LOAI_HINH === "HKD" ? "Thuế TNCN" : "Thuế TNDN") + " phải nộp (4) = (3) × " + (rate * 100) + "%", thue] });
  const m = kt_model(cfg, ky, opt.id, opt.code, "SỔ CHI TIẾT DOANH THU, CHI PHÍ", cols, rows);
  m.tong = { doanhThu: t1, chiPhi: t2, chenhLech: cl, thue: thue };
  m.notes.push("Chi phí gồm giá vốn hàng bán (bình quân gia quyền) và chi phí trong sheet Chi_phi. Chi phí phải có hóa đơn/chứng từ hợp lệ mới được tính là chi phí hợp lý.");
  return m;
}

function kt_thueSuatTNDN(cfg, dtNam) {
  const v = kt_str(cfg.THUE_SUAT_TNDN).toUpperCase();
  if (v && v !== "AUTO") return kt_rate(cfg.THUE_SUAT_TNDN);
  return kt_thueSuatThuNhap(dtNam);
}

// S2d-HKD / S2c-DNSN / S06-DNN: Sổ chi tiết vật liệu, dụng cụ, sản phẩm, hàng hóa
function kt_mdlKho(J, ky, opt) {
  const cfg = J.cfg;
  const cols = [{ l: "Số hiệu", c: "A", t: "x" }, { l: "Ngày, tháng", c: "B", t: "d" }, { l: "Diễn giải", c: "C", t: "x" }, { l: "ĐVT", c: "D", t: "x" },
    { l: "Đơn giá", c: "1", t: "m" }, { l: "Nhập SL", c: "2", t: "q" }, { l: "Nhập thành tiền", c: "3", t: "m" },
    { l: "Xuất SL", c: "4", t: "q" }, { l: "Xuất thành tiền", c: "5", t: "m" }, { l: "Tồn SL", c: "6", t: "q" }, { l: "Tồn thành tiền", c: "7", t: "m" }, { l: "Ghi chú", c: "8", t: "x" }];
  const rows = [];
  const byMa = {};
  J.stockMoves.forEach(s => (byMa[s.ma] = byMa[s.ma] || []).push(s));
  const tongHop = [];
  Object.keys(byMa).sort().forEach(ma => {
    const mv = byMa[ma];
    let slDau = 0, gtDau = 0;
    mv.filter(s => s.ngay < ky.tu).forEach(s => { slDau = s.slTon; gtDau = s.gtTon; });
    const trong = mv.filter(s => s.ngay >= ky.tu && s.ngay <= ky.den);
    if (!trong.length && !slDau) return;
    const ten = mv[0].ten, dvt = mv[0].dvt;
    rows.push({ k: "g", c: ["", "", "Mã hàng: " + ma + " — " + ten, dvt, "", "", "", "", "", "", "", ""] });
    rows.push({ k: "d", c: ["", "", "Số dư đầu kỳ", dvt, slDau ? kt_round(gtDau / slDau) : "", "", "", "", "", slDau, kt_round(gtDau), ""] });
    let sn = 0, gn = 0, sx = 0, gx = 0, slT = slDau, gtT = gtDau;
    trong.forEach(s => {
      slT = s.slTon; gtT = s.gtTon;
      if (s.loai === "NHAP") { sn += s.sl; gn += s.gt; rows.push({ k: "d", c: [s.soCT, kt_fmtDate(s.ngay), s.dienGiai, dvt, kt_round(s.gia), s.sl, kt_round(s.gt), "", "", slT, kt_round(gtT), ""] }); }
      else if (s.loai === "XUAT") { sx += s.sl; gx += s.gt; rows.push({ k: "d", c: [s.soCT, kt_fmtDate(s.ngay), s.dienGiai, dvt, kt_round(s.gia), "", "", s.sl, kt_round(s.gt), slT, kt_round(gtT), slT < 0 ? "Âm kho" : ""] }); }
      else if (s.loai === "DAU") { /* tồn đầu nằm trong kỳ đầu tiên */ slT = s.slTon; gtT = s.gtTon; rows[rows.length - 1].c[9] = slT; rows[rows.length - 1].c[10] = kt_round(gtT); rows[rows.length - 1].c[4] = kt_round(s.gia); slDau = s.slTon; gtDau = s.gtTon; }
    });
    rows.push({ k: "t", c: ["", "", "Cộng phát sinh trong kỳ", dvt, "", sn, kt_round(gn), sx, kt_round(gx), "", "", ""] });
    rows.push({ k: "t", c: ["", "", "Số dư cuối kỳ", dvt, slT ? kt_round(gtT / slT) : "", "", "", "", "", slT, kt_round(gtT), ""] });
    tongHop.push({ ma: ma, ten: ten, dvt: dvt, slDau: slDau, gtDau: gtDau, sn: sn, gn: gn, sx: sx, gx: gx, slCuoi: slT, gtCuoi: gtT });
  });
  if (!rows.length) rows.push({ k: "n", c: ["", "", "Không có hàng hóa phát sinh", "", "", "", "", "", "", "", "", ""] });
  const m = kt_model(cfg, ky, opt.id, opt.code, "SỔ CHI TIẾT VẬT LIỆU, DỤNG CỤ, SẢN PHẨM, HÀNG HÓA", cols, rows);
  m.tongHop = tongHop;
  m.notes.push("Đơn giá xuất kho tính theo phương pháp bình quân gia quyền (di động sau mỗi lần nhập).");
  return m;
}

// Bảng tổng hợp Nhập - Xuất - Tồn (S07-DNN; dùng cho mọi loại hình)
function kt_mdlTongHopNXT(J, ky, opt) {
  const kho = kt_mdlKho(J, ky, { id: "tmp", code: "" });
  const cols = [{ l: "Mã hàng", c: "A", t: "x" }, { l: "Tên hàng", c: "B", t: "x" }, { l: "ĐVT", c: "C", t: "x" },
    { l: "Tồn đầu SL", c: "1", t: "q" }, { l: "Tồn đầu giá trị", c: "2", t: "m" }, { l: "Nhập SL", c: "3", t: "q" }, { l: "Nhập giá trị", c: "4", t: "m" },
    { l: "Xuất SL", c: "5", t: "q" }, { l: "Xuất giá trị", c: "6", t: "m" }, { l: "Tồn cuối SL", c: "7", t: "q" }, { l: "Tồn cuối giá trị", c: "8", t: "m" }];
  const rows = [];
  const T = [0, 0, 0, 0];
  kho.tongHop.forEach(x => {
    rows.push({ k: "d", c: [x.ma, x.ten, x.dvt, x.slDau, kt_round(x.gtDau), x.sn, kt_round(x.gn), x.sx, kt_round(x.gx), x.slCuoi, kt_round(x.gtCuoi)] });
    T[0] += x.gtDau; T[1] += x.gn; T[2] += x.gx; T[3] += x.gtCuoi;
  });
  rows.push({ k: "t", c: ["", "Cộng", "", "", kt_round(T[0]), "", kt_round(T[1]), "", kt_round(T[2]), "", kt_round(T[3])] });
  const m = kt_model(J.cfg, ky, opt.id, opt.code, "BẢNG TỔNG HỢP CHI TIẾT VẬT LIỆU, DỤNG CỤ, SẢN PHẨM, HÀNG HÓA", cols, rows);
  m.tong = { tonDau: T[0], nhap: T[1], xuat: T[2], tonCuoi: T[3] };
  return m;
}

// S2e-HKD / S2d-DNSN / S04a-DNN / Sổ tiền gửi: Sổ chi tiết tiền
function kt_mdlTien(J, ky, opt) {
  const cfg = J.cfg;
  const tks = opt.tks || ["1111", "1121"];
  const coTKDU = cfg.LOAI_HINH === "DNN";
  const cols = [{ l: "Số hiệu chứng từ", c: "A", t: "x" }, { l: "Ngày, tháng", c: "B", t: "d" }, { l: "Diễn giải", c: "C", t: "x" }]
    .concat(coTKDU ? [{ l: "TK đối ứng", c: "D", t: "x" }] : [])
    .concat([{ l: "Thu / Gửi vào", c: "1", t: "m" }, { l: "Chi / Rút ra", c: "2", t: "m" }, { l: "Tồn", c: "3", t: "m" }]);
  const rows = [];
  const pad = a => coTKDU ? a : a.filter((x, i) => i !== 3);
  const sd = kt_soDu(J, new Date(ky.tu.getTime() - 1)).tk;
  const tong = {};
  tks.forEach(tk => {
    rows.push({ k: "g", c: pad(["", "", tk === "1111" ? "TIỀN MẶT" : "TIỀN GỬI NGÂN HÀNG KHÔNG KỲ HẠN", "", "", "", ""]) });
    let ton = sd[tk] || 0, thu = 0, chi = 0;
    rows.push({ k: "d", c: pad(["", "", "Số dư đầu kỳ", "", "", "", ton]) });
    const g = {};
    const order = [];
    J.pairs.forEach(p => {
      if (!kt_inKy(p, ky) || (p.no !== tk && p.co !== tk)) return;
      const huong = p.no === tk ? "T" : "C";
      const du = p.no === tk ? p.co : p.no;
      const k = p.soCT + "|" + huong;
      if (!g[k]) { g[k] = { soCT: p.soCT, ngay: p.ngay, dg: p.dienGiai, du: {}, thu: 0, chi: 0 }; order.push(k); }
      g[k].du[du] = 1;
      if (huong === "T") g[k].thu += p.tien; else g[k].chi += p.tien;
    });
    order.sort((a, b) => g[a].ngay - g[b].ngay).forEach(k => {
      const x = g[k];
      ton += x.thu - x.chi; thu += x.thu; chi += x.chi;
      rows.push({ k: "d", c: pad([x.soCT, kt_fmtDate(x.ngay), x.dg, Object.keys(x.du).join(","), x.thu || "", x.chi || "", ton]) });
    });
    rows.push({ k: "t", c: pad(["", "", "Cộng phát sinh trong kỳ", "", thu, chi, ""]) });
    rows.push({ k: "t", c: pad(["", "", "Số dư cuối kỳ", "", "", "", ton]) });
    tong[tk] = { dau: sd[tk] || 0, thu: thu, chi: chi, cuoi: ton };
  });
  const m = kt_model(cfg, ky, opt.id, opt.code, opt.title || "SỔ CHI TIẾT TIỀN", cols, rows);
  m.tong = tong;
  return m;
}

// Sổ chi tiết thanh toán với người mua / người bán (S4a-DNSN, DNN, HKD tham khảo)
function kt_mdlCongNo(J, ky, opt) {
  const cfg = J.cfg;
  const cols = [{ l: "Ngày, tháng", c: "A", t: "d" }, { l: "Số hiệu chứng từ", c: "B", t: "x" }, { l: "Diễn giải", c: "C", t: "x" },
    { l: "Phát sinh Nợ", c: "1", t: "m" }, { l: "Phát sinh Có", c: "2", t: "m" }, { l: "Số dư Nợ", c: "3", t: "m" }, { l: "Số dư Có", c: "4", t: "m" }];
  const rows = [];
  const sdDau = kt_soDu(J, new Date(ky.tu.getTime() - 1)).dt;
  const tenDT = {};
  Object.keys(J.src.customers).forEach(k => tenDT["131|" + k] = J.src.customers[k].ten);
  Object.keys(J.src.suppliers).forEach(k => tenDT["331|" + k] = J.src.suppliers[k].ten);
  const tongHop = [];
  [["131", "PHẢI THU CỦA KHÁCH HÀNG (TK 131)"], ["331", "PHẢI TRẢ CHO NGƯỜI BÁN (TK 331)"]].forEach(([tk, nhan]) => {
    const ps = {};
    J.pairs.forEach(p => {
      if (!kt_inKy(p, ky)) return;
      if (p.no === tk) { const k = tk + "|" + (p.dtNo || ""); (ps[k] = ps[k] || []).push({ p: p, no: p.tien, co: 0 }); if (p.tenDT) tenDT[k] = tenDT[k] || p.tenDT; }
      if (p.co === tk) { const k = tk + "|" + (p.dtCo || ""); (ps[k] = ps[k] || []).push({ p: p, no: 0, co: p.tien }); if (p.tenDT) tenDT[k] = tenDT[k] || p.tenDT; }
    });
    const keys = {};
    Object.keys(ps).forEach(k => keys[k] = 1);
    Object.keys(sdDau).filter(k => k.indexOf(tk + "|") === 0 && Math.abs(sdDau[k]) >= 1).forEach(k => keys[k] = 1);
    if (!Object.keys(keys).length) return;
    rows.push({ k: "g", c: ["", "", nhan, "", "", "", ""] });
    Object.keys(keys).sort().forEach(k => {
      const ma = k.split("|")[1];
      rows.push({ k: "g", c: ["", ma, "Đối tượng: " + (ma ? ma + " - " : "") + (tenDT[k] || (ma ? "" : "(chưa có mã đối tượng)")), "", "", "", ""] });
      let du = sdDau[k] || 0, tn = 0, tc = 0;
      rows.push({ k: "d", c: ["", "", "Số dư đầu kỳ", "", "", du > 0 ? du : "", du < 0 ? -du : ""] });
      (ps[k] || []).sort((a, b) => a.p.ngay - b.p.ngay).forEach(x => {
        du += x.no - x.co; tn += x.no; tc += x.co;
        rows.push({ k: "d", c: [kt_fmtDate(x.p.ngay), x.p.soCT, x.p.dienGiai, x.no || "", x.co || "", du > 0 ? du : "", du < 0 ? -du : ""] });
      });
      rows.push({ k: "t", c: ["", "", "Cộng phát sinh / Số dư cuối kỳ", tn, tc, du > 0 ? du : "", du < 0 ? -du : ""] });
      tongHop.push({ tk: tk, ma: ma, ten: tenDT[k] || "", dau: sdDau[k] || 0, no: tn, co: tc, cuoi: du });
    });
  });
  if (!rows.length) rows.push({ k: "n", c: ["", "", "Không có công nợ", "", "", "", ""] });
  const m = kt_model(cfg, ky, opt.id, opt.code, "SỔ CHI TIẾT THANH TOÁN VỚI NGƯỜI MUA (NGƯỜI BÁN)", cols, rows);
  m.tongHop = tongHop;
  return m;
}

// S03a-DNN: Sổ Nhật ký chung
function kt_mdlNKC(J, ky, opt) {
  const cols = [{ l: "Ngày, tháng ghi sổ", c: "A", t: "d" }, { l: "Số hiệu chứng từ", c: "B", t: "x" }, { l: "Ngày, tháng chứng từ", c: "C", t: "d" },
    { l: "Diễn giải", c: "D", t: "x" }, { l: "Số hiệu TK", c: "E", t: "x" }, { l: "Số phát sinh Nợ", c: "1", t: "m" }, { l: "Số phát sinh Có", c: "2", t: "m" }];
  const rows = [];
  let tn = 0;
  J.pairs.filter(p => kt_inKy(p, ky)).sort((a, b) => (a.ngay - b.ngay) || (a.soCT < b.soCT ? -1 : 1)).forEach(p => {
    const d = kt_fmtDate(p.ngay);
    rows.push({ k: "d", c: [d, p.soCT, d, p.dienGiai, p.no, p.tien, ""] });
    rows.push({ k: "d", c: ["", "", "", "", p.co, "", p.tien] });
    tn += p.tien;
  });
  rows.push({ k: "t", c: ["", "", "", "Cộng phát sinh", "", tn, tn] });
  return kt_model(J.cfg, ky, opt.id, opt.code, "SỔ NHẬT KÝ CHUNG", cols, rows);
}

// S03b-DNN: Sổ Cái (theo hình thức Nhật ký chung)
function kt_mdlSoCai(J, ky, opt) {
  const cols = [{ l: "Ngày, tháng ghi sổ", c: "A", t: "d" }, { l: "Số hiệu chứng từ", c: "B", t: "x" }, { l: "Diễn giải", c: "C", t: "x" },
    { l: "TK đối ứng", c: "D", t: "x" }, { l: "Nợ", c: "1", t: "m" }, { l: "Có", c: "2", t: "m" }];
  const rows = [];
  const sd = kt_soDu(J, new Date(ky.tu.getTime() - 1)).tk;
  KT_TK.forEach(([tk, ten]) => {
    const ps = J.pairs.filter(p => kt_inKy(p, ky) && (p.no === tk || p.co === tk)).sort((a, b) => a.ngay - b.ngay);
    const dau = sd[tk] || 0;
    if (!ps.length && Math.abs(dau) < 1) return;
    rows.push({ k: "g", c: ["", "", "Tài khoản " + tk + " — " + ten, "", "", ""] });
    rows.push({ k: "d", c: ["", "", "Số dư đầu kỳ", "", dau > 0 ? dau : "", dau < 0 ? -dau : ""] });
    let n = 0, c = 0;
    ps.forEach(p => {
      if (p.no === tk) { n += p.tien; rows.push({ k: "d", c: [kt_fmtDate(p.ngay), p.soCT, p.dienGiai, p.co, p.tien, ""] }); }
      else { c += p.tien; rows.push({ k: "d", c: [kt_fmtDate(p.ngay), p.soCT, p.dienGiai, p.no, "", p.tien] }); }
    });
    const cuoi = dau + n - c;
    rows.push({ k: "t", c: ["", "", "Cộng số phát sinh", "", n, c] });
    rows.push({ k: "t", c: ["", "", "Số dư cuối kỳ", "", cuoi > 0 ? cuoi : "", cuoi < 0 ? -cuoi : ""] });
  });
  return kt_model(J.cfg, ky, opt.id, opt.code, "SỔ CÁI", cols, rows);
}

// F01-DNN: Bảng cân đối tài khoản
function kt_mdlCDTK(J, ky, opt) {
  const cols = [{ l: "Số hiệu TK", c: "A", t: "x" }, { l: "Tên tài khoản", c: "B", t: "x" },
    { l: "Dư Nợ đầu kỳ", c: "1", t: "m" }, { l: "Dư Có đầu kỳ", c: "2", t: "m" }, { l: "Phát sinh Nợ", c: "3", t: "m" },
    { l: "Phát sinh Có", c: "4", t: "m" }, { l: "Dư Nợ cuối kỳ", c: "5", t: "m" }, { l: "Dư Có cuối kỳ", c: "6", t: "m" }];
  const dauAll = kt_soDu(J, new Date(ky.tu.getTime() - 1));
  const cuoiAll = kt_soDu(J, ky.den);
  const ps = kt_phatSinh(J, ky.tu, ky.den);
  const rows = [];
  const T = [0, 0, 0, 0, 0, 0];
  const tach = (all, tk) => {
    if (tk === "131" || tk === "331") {
      let n = 0, c = 0;
      Object.keys(all.dt).filter(k => k.indexOf(tk + "|") === 0).forEach(k => { const v = all.dt[k]; if (v > 0) n += v; else c -= v; });
      return [n, c];
    }
    const v = all.tk[tk] || 0;
    return v >= 0 ? [v, 0] : [0, -v];
  };
  KT_TK.forEach(([tk, ten]) => {
    const d = tach(dauAll, tk), c = tach(cuoiAll, tk), p = ps[tk] || { no: 0, co: 0 };
    if (!d[0] && !d[1] && !p.no && !p.co && !c[0] && !c[1]) return;
    const r = [d[0], d[1], p.no, p.co, c[0], c[1]].map(kt_round);
    r.forEach((v, i) => T[i] += v);
    rows.push({ k: "d", c: [tk, ten].concat(r.map(v => v || "")) });
  });
  rows.push({ k: "t", c: ["", "Tổng cộng"].concat(T) });
  const m = kt_model(J.cfg, ky, opt.id, opt.code, "BẢNG CÂN ĐỐI TÀI KHOẢN", cols, rows);
  m.canDoi = Math.abs(T[0] - T[1]) < 2 && Math.abs(T[2] - T[3]) < 2 && Math.abs(T[4] - T[5]) < 2;
  if (!m.canDoi) m.notes.push("CẢNH BÁO: bảng chưa cân — kiểm tra lại số dư đầu kỳ.");
  return m;
}

// ---------- BÁO CÁO TÀI CHÍNH ----------
function kt_chiTieuB01(J, den) {
  const all = kt_soDu(J, den);
  const b = tk => all.tk[tk] || 0;
  let pt131 = 0, tt131 = 0, pt331 = 0, tt331 = 0;
  Object.keys(all.dt).forEach(k => {
    const v = all.dt[k];
    if (k.indexOf("131|") === 0) { if (v > 0) pt131 += v; else tt131 -= v; }
    if (k.indexOf("331|") === 0) { if (v > 0) pt331 += v; else tt331 -= v; }
  });
  const loiNhuanKy = -KT_TK.filter(t => t[2] === "KQ").reduce((s, t) => s + b(t[0]), 0);
  const v = {
    tien: b("1111") + b("1121"),
    phaiThuKH: pt131, traTruocNB: pt331, phaiThuKhac: b("1388") + b("141"),
    htk: b("152") + b("153") + b("1561"),
    nguyenGia: b("211"), haoMon: b("214"),
    vatKhauTru: b("1331"), taiSanKhac: b("242"),
    phaiTraNB: tt331, nguoiMuaTraTruoc: tt131,
    thue: -(b("33311") + b("3334") + b("3335") + b("3338")),
    phaiTraNLD: -b("334"), phaiTraKhac: -(b("335") + b("3388")), vay: -b("341"),
    vonGop: -b("4111"), loiNhuan: -b("421") + loiNhuanKy
  };
  return v;
}

function kt_mdlB01(J, ky, opt) {
  const cfg = J.cfg;
  const c = kt_chiTieuB01(J, ky.den);

  const rows = [];
  const R = (k, ten, ma, f) => rows.push({ k: k, c: k === "g" ? [ten, "", "", "", ""] : [ten, ma, "", kt_round(f(c)), kt_round(f(d))] });
  let canDoi;
  if (cfg.LOAI_HINH === "DNSN") {
    const ts = x => x.tien + (x.phaiThuKH + x.traTruocNB + x.phaiThuKhac) + x.htk + (x.nguyenGia + x.haoMon) + (x.vatKhauTru + x.taiSanKhac);
    const no310 = x => x.phaiTraNB + x.nguoiMuaTraTruoc + x.phaiTraNLD + x.phaiTraKhac + x.vay;
    R("g", "TÀI SẢN", "", () => "");

    R("g", "NGUỒN VỐN", "", () => "");
    R("t", "I. Nợ phải trả (300 = 310+320)", "300", x => no310(x) + x.thue);

    R("d", "1. Vốn đầu tư của chủ sở hữu", "410", x => x.vonGop);
    R("d", "2. Lợi nhuận sau thuế chưa phân phối", "420", x => x.loiNhuan);
